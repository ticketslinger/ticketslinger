name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env: { POSTGRES_DB: ticketslinger, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["54329:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL_OWNER: postgres://ts_owner:ts_owner@localhost:54329/ticketslinger?sslmode=disable
      TEST_DATABASE_URL_APP: postgres://ts_app:ts_app@localhost:54329/ticketslinger?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: { go-version-file: api/go.mod, cache-dependency-path: api/go.sum }
      - run: PGPASSWORD=postgres psql -h localhost -p 54329 -U postgres -f deploy/initdb/01-roles.sql
      - run: cd api && go vet ./... && go test -race ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with: { version: v2.14.0, working-directory: api }
      - name: Generated code is current
        run: cd api && go generate ./... && git diff --exit-code
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
      - run: bunx biome ci --no-errors-on-unmatched .
      # The workspace steps skip cleanly until web/* packages exist.
      - name: Generated code is current
        run: |
          ls web/*/package.json >/dev/null 2>&1 || exit 0
          bun run --filter '*' gen && git diff --exit-code
      - name: Typecheck
        run: |
          ls web/*/package.json >/dev/null 2>&1 || exit 0
          bun run --filter '*' typecheck
      - run: bun test --pass-with-no-tests
      - name: Build
        run: |
          ls web/*/package.json >/dev/null 2>&1 || exit 0
          bun run --filter '*' build
