name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env: { POSTGRES_DB: ticketslinger, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["54329:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL_OWNER: postgres://ts_owner:ts_owner@localhost:54329/ticketslinger?sslmode=disable
      TEST_DATABASE_URL_APP: postgres://ts_app:ts_app@localhost:54329/ticketslinger?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: api/go.mod, cache-dependency-path: api/go.sum }
      - run: PGPASSWORD=postgres psql -h localhost -p 54329 -U postgres -f deploy/initdb/01-roles.sql
      - run: cd api && go vet ./... && go test -race ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with: { version: v2.14.0, working-directory: api }
      - name: Generated code is current
        run: |
          cd api && go generate ./...
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
      - run: bunx biome ci --no-errors-on-unmatched .
      - name: Generated code is current
        run: |
          bun run --filter '*' gen
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
      - run: bun run --filter '*' typecheck
      - run: bun test --pass-with-no-tests
      - run: bun run --filter '*' build
  e2e:
    runs-on: ubuntu-latest
    # The suite plus perf.spec.ts's Lighthouse run; a hang fails here, not after six hours.
    timeout-minutes: 25
    services:
      db:
        image: postgres:18
        env: { POSTGRES_DB: ticketslinger, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["54329:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: api/go.mod, cache-dependency-path: api/go.sum }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.14 }
      - run: PGPASSWORD=postgres psql -h localhost -p 54329 -U postgres -f deploy/initdb/01-roles.sql
      - run: bun install --frozen-lockfile
      # Playwright and Lighthouse run on Node; lighthouse 13 needs 22.19 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22.x }
      - run: node -v
      - run: cd e2e && bunx playwright install --with-deps chromium
      - run: cd e2e && bunx playwright test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
