name: stripe-smoke
# Manual only, never a required check: it spends real test-mode API calls and
# needs the repo's Stripe test secrets.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: stripe-smoke, cancel-in-progress: false }
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:18
        env: { POSTGRES_DB: ticketslinger, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["54329:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      STRIPE_SMOKE_ACCOUNT: ${{ vars.STRIPE_SMOKE_ACCOUNT }}
      TS_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      TS_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test keys only
        run: |
          case "$TS_STRIPE_SECRET_KEY" in sk_test_*) ;; *) echo "STRIPE_TEST_SECRET_KEY isn't a test key"; exit 1;; esac
          case "$TS_STRIPE_PUBLISHABLE_KEY" in pk_test_*) ;; *) echo "STRIPE_TEST_PUBLISHABLE_KEY isn't a test key"; exit 1;; esac
          test -n "$STRIPE_SMOKE_ACCOUNT" || { echo "set the STRIPE_SMOKE_ACCOUNT variable"; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: api/go.mod, cache-dependency-path: api/go.sum }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.14 }
      - name: Stripe CLI (pinned, checksum verified)
        env: { STRIPE_CLI_VERSION: "1.45.1" }
        run: |
          base="https://github.com/stripe/stripe-cli/releases/download/v${STRIPE_CLI_VERSION}"
          tarball="stripe_${STRIPE_CLI_VERSION}_linux_x86_64.tar.gz"
          curl -fsSL -o "$tarball" "$base/$tarball"
          curl -fsSL -o checksums.txt "$base/stripe-linux-checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" stripe && sudo mv stripe /usr/local/bin/stripe
      - run: PGPASSWORD=postgres psql -h localhost -p 54329 -U postgres -f deploy/initdb/01-roles.sql
      - run: bun install --frozen-lockfile
      - run: cd e2e && bunx playwright install --with-deps chromium
      - name: Forward Stripe's events to the API
        run: |
          secret="$(stripe listen --api-key "$TS_STRIPE_SECRET_KEY" --print-secret)"
          echo "::add-mask::$secret"
          echo "TS_STRIPE_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
          # --latest: the account's default API version is one our webhook refuses.
          nohup stripe listen --api-key "$TS_STRIPE_SECRET_KEY" --latest \
            --events payment_intent.succeeded,account.updated,account.application.deauthorized,refund.created,refund.updated,refund.failed,charge.refunded \
            --forward-to http://127.0.0.1:3001/v1/webhooks/stripe \
            --forward-connect-to http://127.0.0.1:3001/v1/webhooks/stripe > stripe-listen.log 2>&1 &
      - run: cd e2e && bunx playwright test stripe-smoke.spec.ts
      # stripe-listen.log stays on the runner: it can carry event payloads.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: stripe-smoke-report, path: e2e/playwright-report, retention-days: 7 }
