name: release
# Every version tag builds the tarball the server deploys, starts it as the server
# would, and only then publishes it as a GitHub release.
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      db:
        image: postgres:18
        env: { POSTGRES_DB: ticketslinger, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["54329:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: api/go.mod, cache-dependency-path: api/go.sum }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
      - run: scripts/release.sh "$GITHUB_REF_NAME" out
      - name: Unpack as the server does
        run: |
          tar -tzf out/*.tar.gz | grep -qx './bin/ticketslinger'
          mkdir rel && tar -xzf out/*.tar.gz -C rel
      - run: PGPASSWORD=postgres psql -h localhost -p 54329 -U postgres -f deploy/initdb/01-roles.sql
      - name: Migrate with only the owner URL
        run: env -i PATH="$PATH" TS_MIGRATE_DATABASE_URL='postgres://ts_owner:ts_owner@localhost:54329/ticketslinger?sslmode=disable' rel/bin/ticketslinger migrate
      - name: Start all three and check they answer
        env:
          TS_DATABASE_URL: postgres://ts_app:ts_app@localhost:54329/ticketslinger?sslmode=disable
          # Test-only key: 32 zero bytes.
          TS_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          TS_ALLOW_NO_TURNSTILE: "1"
          TS_HTTP_ADDR: 127.0.0.1:3000
          TS_PUBLIC_URL: http://127.0.0.1:3000
        run: |
          rel/bin/ticketslinger serve >api.log 2>&1 &
          (cd rel/storefront && bun server.js >../../storefront.log 2>&1 &)
          (cd rel/dashboard && bun server.js >../../dashboard.log 2>&1 &)
          up() {
            curl -fsS -o /dev/null 127.0.0.1:3000/v1/health &&
              curl -fsS -o /dev/null 127.0.0.1:3001/healthz &&
              curl -fsS -o /dev/null 127.0.0.1:3002/
          }
          for _ in $(seq 30); do up 2>/dev/null && break; sleep 1; done
          up || { tail -n 50 api.log storefront.log dashboard.log; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            out/*.tar.gz
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release, path: out }
      - run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Build of $GITHUB_SHA."
