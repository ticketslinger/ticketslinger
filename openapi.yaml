openapi: 3.1.0
info:
  title: TicketSlinger API
  version: 0.1.0
  license: { name: AGPL-3.0-only, identifier: AGPL-3.0-only }
  description: |
    Every POST, PUT, PATCH and DELETE accepts an Idempotency-Key header: 1 to 255 printable ASCII characters, a fresh random value per intended action (400 bad_idempotency_key otherwise). Send the same key to retry and nothing happens twice. The first response is kept for 24 hours and replayed with Idempotent-Replayed: true. Keys belong to the caller (the signed-in user, the API key, or nobody for public calls) and to the method and path, so they never cross between callers. The same key with a different body is 422 idempotency_key_reused. The same key while the first request is still running is 409 idempotency_in_progress; wait a moment and retry. Responses with a 5xx status, and 429 rate-limit answers, are not kept, so a retry runs fresh; 409 idempotency_in_progress carries Retry-After: 1. Operations that hand back credentials (sign-up, sign-in, authenticator setup, recovery codes, API key creation) never keep their responses, so a retry runs again. Without signing in, the key must be random and at least 22 letters, digits, - or _ (a UUID works). Busy moments on a sale answer 503 try_again with Retry-After: 1.
servers:
  - url: https://api.ticketslinger.com/v1
security:
  - session: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
  /auth/signup:
    post:
      operationId: signup
      x-idempotency-store: false
      description: "Its response carries credentials, so it is never kept for replay, so a retry with the same Idempotency-Key runs again, and a duplicate sent while the first is running is 409 idempotency_in_progress."
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SignupRequest" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/SessionCreated" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      operationId: login
      x-idempotency-store: false
      description: "401 totp_required means the account has an authenticator app; send totp_code, or a recovery_code instead. A valid recovery code is accepted for any account with a second factor and gives a session that passed it. Its response carries credentials, so it is never kept for replay, so a retry with the same Idempotency-Key runs again, and a duplicate sent while the first is running is 409 idempotency_in_progress."
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SessionCreated" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      operationId: logout
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/verify-email:
    post:
      operationId: verifyEmail
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
      responses:
        "204": { description: Verified }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/totp:
    post:
      operationId: startTotp
      x-idempotency-store: false
      description: Starts setting up an authenticator app. Unless this session passed a second factor, send the current password. Once the account has a passkey or an authenticator app, only a session that passed one may start (403 mfa_required). The setup expires if not confirmed within 10 minutes. Its response carries credentials, so it is never kept for replay, so a retry with the same Idempotency-Key runs again, and a duplicate sent while the first is running is 409 idempotency_in_progress.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { password: { type: string } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TotpSetup" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/totp/confirm:
    post:
      operationId: confirmTotp
      description: Switches the authenticator app on. Refused (403 mfa_required) if the account gained a passkey since setup started and this session hasn't passed it; a setup older than 10 minutes is 400 totp_not_started.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, pattern: "^[0-9]{6}$" } } } } } }
      responses:
        "204": { description: Enabled }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/recovery-codes:
    post:
      operationId: createRecoveryCodes
      x-idempotency-store: false
      description: Replaces the account's recovery codes with ten new single-use ones and returns them. They are shown this once. Needs a session that passed a second factor (403 mfa_required) and an account that has one (409 no_second_factor). Its response carries credentials, so it is never kept for replay, so a retry with the same Idempotency-Key runs again, and a duplicate sent while the first is running is 409 idempotency_in_progress.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: "The new codes, once", content: { application/json: { schema: { type: object, required: [codes], properties: { codes: { type: array, items: { type: string } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/passkeys/register:
    post:
      operationId: beginPasskeyRegistration
      description: Starts adding a passkey. Unless this session passed a second factor, send the current password. Once the account has a passkey or authenticator app, only a session that passed one may add another (403 mfa_required).
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { password: { type: string } } } } } }
      responses:
        "200": { description: Options, content: { application/json: { schema: { $ref: "#/components/schemas/WebAuthnChallenge" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/passkeys/register/{challengeId}:
    post:
      operationId: finishPasskeyRegistration
      parameters:
        - { name: challengeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: name, in: query, required: false, schema: { type: string, maxLength: 120 } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Passkey" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/passkeys/login:
    post:
      operationId: beginPasskeyLogin
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: Options, content: { application/json: { schema: { $ref: "#/components/schemas/WebAuthnChallenge" } } } }
        "429": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/passkeys/login/{challengeId}:
    post:
      operationId: finishPasskeyLogin
      x-idempotency-store: false
      description: "Its response carries credentials, so it is never kept for replay, so a retry with the same Idempotency-Key runs again, and a duplicate sent while the first is running is 409 idempotency_in_progress."
      security: []
      parameters: [{ name: challengeId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SessionCreated" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /me:
    get:
      operationId: getMe
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /organizers:
    get:
      operationId: listOrganizers
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Organizer" } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createOrganizer
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateOrganizer" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Organizer" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}:
    get:
      operationId: getOrganizer
      parameters: [{ $ref: "#/components/parameters/OrganizerPath" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Organizer" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/audit:
    get:
      operationId: listAudit
      parameters: [{ $ref: "#/components/parameters/OrganizerPath" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/api-keys:
    get:
      operationId: listApiKeys
      description: Owners and admins only, from a signed-in session. An API key gets 403 session_required.
      parameters: [{ $ref: "#/components/parameters/OrganizerPath" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ApiKey" } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createApiKey
      x-idempotency-store: false
      description: Owners and admins only, from a signed-in session. The token is in this response and nowhere else, ever. Its response carries credentials, so it is never kept for replay, so a retry with the same Idempotency-Key runs again, and a duplicate sent while the first is running is 409 idempotency_in_progress.
      parameters: [{ $ref: "#/components/parameters/OrganizerPath" }, { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateApiKey" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ApiKeyCreated" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/api-keys/{apiKey}:
    delete:
      operationId: revokeApiKey
      description: Owners and admins only, from a signed-in session. The key stops working at once; revoking it again changes nothing.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { name: apiKey, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events:
    get:
      operationId: listEvents
      description: Any member, or any API key. Soonest first.
      parameters: [{ $ref: "#/components/parameters/OrganizerPath" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Event" } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createEvent
      description: Owners and admins, or a write API key. The event starts as a draft. starts_at and ends_at are required (422 missing_field).
      parameters: [{ $ref: "#/components/parameters/OrganizerPath" }, { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateEvent" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}:
    get:
      operationId: getEvent
      description: Any member, or any API key.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateEvent
      description: "Owners and admins, or a write API key. Send only what changes. status moves between draft and live; ended and cancelled aren't available yet (422 status_not_allowed). Going live is refused with 422 event_over once ends_at has passed (an event that has started but not ended can go live), 422 no_ticket_types without a ticket type, and 422 unquotaed_ticket_type while a ticket type has no quota. A live event's ends_at can still change. The slug changes only on a draft (409 slug_locked). Once tickets are sold or held in an open checkout, tax_rate_bp, prices_include_tax, fee_mode and timezone can't change and the event can't go back to draft (409 has_sales; any order counts, even one without tickets); field names the property refused."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateEvent" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteEvent
      description: Owners and admins, or a write API key. Drafts only; a live event answers 409 event_not_draft, and a draft with orders answers 409 has_sales.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/ticket-types:
    get:
      operationId: listTicketTypes
      description: Any member, or any API key. In position order.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TicketType" } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createTicketType
      description: Owners and admins, or a write API key. It goes to the end of the list. price_cents is required (422 missing_field).
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateTicketType" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/TicketType" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/ticket-types/order:
    put:
      operationId: reorderTicketTypes
      description: "Owners and admins, or a write API key. Send every ticket type id of this event once, in the order you want; they take positions 1 to n together, or none changes. Anything else, a missing, repeated or foreign id included, is 422 order_mismatch. The same order again changes nothing. Returns the list."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrderIds" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TicketType" } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/ticket-types/{ticketType}:
    get:
      operationId: getTicketType
      description: Any member, or any API key.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/TicketTypePath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TicketType" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateTicketType
      description: "Owners and admins, or a write API key. Send only what changes. Showing a hidden ticket type that a promo code unlocks answers 409 unlocked_by_promo. Once this ticket type is sold or held in an open checkout, price_cents, tax_rate_bp, prices_include_tax, min_per_order and max_per_order can't change (409 has_sales); name, description, the sales window and hidden still can."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/TicketTypePath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TicketTypeFields" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TicketType" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteTicketType
      description: Owners and admins, or a write API key. The last ticket type of a live event answers 409 last_ticket_type_live. One that has been sold, or is held in an open checkout, answers 409 has_sales.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/TicketTypePath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/quotas:
    get:
      operationId: listQuotas
      description: Any member, or any API key. Oldest first.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Quota" } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createQuota
      description: Owners and admins, or a write API key. size is required (422 missing_field). ticket_type_ids may be empty; every id must belong to this event (422 unknown_ticket_type). A size below what those ticket types have already sold and hold in open checkouts answers 409 quota_below_sales.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateQuota" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Quota" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/quotas/{quota}:
    get:
      operationId: getQuota
      description: Any member, or any API key.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/QuotaPath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Quota" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateQuota
      description: "Owners and admins, or a write API key. Send only what changes. A ticket_type_ids list replaces the whole set. On a live event, leaving a ticket type in no quota answers 409 live_needs_capacity. size can grow at any time but can't drop below what its ticket types have sold and hold in open checkouts, counting any ticket type the patch adds (409 quota_below_sales). A ticket type with sales can't leave the set (409 has_sales)."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/QuotaPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/QuotaFields" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Quota" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteQuota
      description: Owners and admins, or a write API key. On a live event, a delete that leaves a ticket type in no quota answers 409 live_needs_capacity. A quota whose ticket types have sales, or are held in an open checkout, answers 409 has_sales.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/QuotaPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/promo-codes:
    get:
      operationId: listPromoCodes
      description: Any member, or any API key. Oldest first.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PromoCode" } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createPromoCode
      description: "Owners and admins, or a write API key. code, kind and value are required (422 missing_field). The code is trimmed and upper-cased, and is unique within the event (409 code_taken). Every id in applies_to and unlocks must be a ticket type of this event (422 unknown_ticket_type); unlocks may list only hidden ones (422 unlock_not_hidden)."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreatePromoCode" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PromoCode" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/promo-codes/{promoCode}:
    get:
      operationId: getPromoCode
      description: Any member, or any API key.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/PromoCodePath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PromoCode" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updatePromoCode
      description: "Owners and admins, or a write API key. Send only what changes. Changing kind needs value too (422 value_required_with_kind). applies_to and unlocks replace the whole set when sent. null clears max_uses, valid_from or valid_until; leaving one out keeps it. used_count can't be set. Once an order has used the code, or an open checkout is using it, kind, value, applies_to_all and applies_to can't change (409 has_sales; field names the first one)."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/PromoCodePath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PromoCodeFields" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PromoCode" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deletePromoCode
      description: Owners and admins, or a write API key. A code an order has used, or an open checkout is using, answers 409 has_sales.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/PromoCodePath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/questions:
    get:
      operationId: listQuestions
      description: Any member, or any API key. In position order.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Question" } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createQuestion
      description: "Owners and admins, or a write API key. label, kind and scope are required (422 missing_field). The question goes at the end of the list. Every id in applies_to must be a ticket type of this event (422 unknown_ticket_type)."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateQuestion" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Question" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/questions/order:
    put:
      operationId: reorderQuestions
      description: "Owners and admins, or a write API key. Send every question id of this event once, in the order you want; they take positions 1 to n together, or none changes. Anything else, a missing, repeated or foreign id included, is 422 order_mismatch. The same order again changes nothing. Returns the list."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrderIds" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Question" } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/questions/{question}:
    get:
      operationId: getQuestion
      description: Any member, or any API key.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/QuestionPath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Question" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateQuestion
      description: "Owners and admins, or a write API key. Send only what changes. Turning a question into a select needs options in the same request (422 options_required_with_kind); turning a select into anything else clears its options. applies_to replaces the whole set when sent. Order changes only through the order endpoint."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/QuestionPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/QuestionFields" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Question" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteQuestion
      description: Owners and admins, or a write API key. A question buyers have answered answers 409 has_sales.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/QuestionPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    session: { type: http, scheme: bearer, description: "A session token, or an organizer API key (tsk_...). A key acts only within its own organizer, and gets 403 session_required on anything that needs a person: your account, your organizer list, the audit log and key management. A read key gets 403 scope_read_only on writes." }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, description: "1 to 255 printable ASCII characters. Retrying with the same key replays the first response instead of running again. Callers who aren't signed in need at least 22 characters from A-Z a-z 0-9 - _ (a UUID works).", schema: { type: string, minLength: 1, maxLength: 255 } }
    OrganizerPath: { name: organizer, in: path, required: true, schema: { type: string } }
    QuotaPath: { name: quota, in: path, required: true, schema: { type: string, format: uuid } }
    PromoCodePath: { name: promoCode, in: path, required: true, schema: { type: string, format: uuid } }
    QuestionPath: { name: question, in: path, required: true, schema: { type: string, format: uuid } }
    TicketTypePath: { name: ticketType, in: path, required: true, schema: { type: string, format: uuid } }
    EventPath: { name: event, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Error: { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            field: { type: string, description: "The request property this error is about, when there is one (e.g. price_cents, applies_to, options[2])." }
    Health: { type: object, required: [status], properties: { status: { type: string } } }
    SignupRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 256 }
        name: { type: string, minLength: 1, maxLength: 120 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        totp_code: { type: string, pattern: "^[0-9]{6}$" }
        recovery_code: { type: string, maxLength: 64, description: "One of the account's unused recovery codes, in place of an authenticator code or passkey. Spaces, hyphens and case don't matter; up to 64 characters are read, and 422 invalid_recovery_code means more than 32 are left once spaces and hyphens are dropped. Sending it together with totp_code is 422 one_second_step." }
    SessionCreated:
      type: object
      required: [session_token, user]
      properties: { session_token: { type: string }, user: { $ref: "#/components/schemas/Me" } }
    Me:
      type: object
      required: [id, email, name, email_verified, totp_enabled, has_passkey, has_second_factor, mfa]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        email_verified: { type: boolean }
        totp_enabled: { type: boolean }
        has_passkey: { type: boolean }
        has_second_factor: { type: boolean, description: Whether the account has a passkey or an authenticator app. }
        mfa: { type: boolean, description: Whether this session passed a second factor or a passkey. }
    TotpSetup:
      type: object
      required: [secret, otpauth_url]
      properties: { secret: { type: string }, otpauth_url: { type: string } }
    WebAuthnChallenge:
      type: object
      required: [challenge_id, options]
      properties: { challenge_id: { type: string, format: uuid }, options: { type: object, additionalProperties: true } }
    Passkey:
      type: object
      required: [id, name, created_at]
      properties: { id: { type: string, format: uuid }, name: { type: string }, created_at: { type: string, format: date-time } }
    CreateOrganizer:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, pattern: "^[a-z0-9](-?[a-z0-9])*$", minLength: 3, maxLength: 40 }
    Organizer:
      type: object
      required: [id, name, slug, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        role: { type: string, enum: [owner, admin, checkin, "key:read", "key:write"], description: "Your role here. An API key sees its own scope as key:read or key:write." }
    AuditEntry:
      type: object
      required: [id, action, entity_type, entity_id, at]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid }
        actor_user_id: { type: string, format: uuid }
        actor_api_key_id: { type: string, format: uuid, description: Set instead of actor_user_id when an API key did it. }
        actor_name: { type: [string, "null"], description: "The person's name if they are still a member of this organizer, or the API key's name. Null for former members." }
        actor_email: { type: [string, "null"], description: "The person's email if they are still a member of this organizer. Null for API keys and former members." }
        at: { type: string, format: date-time }
    CreateApiKey:
      type: object
      required: [name, scope]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        scope: { type: string, enum: [read, write], description: "write can also read." }
    ApiKey:
      type: object
      required: [id, name, prefix, scope, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: "The first 8 characters after tsk_, so you can tell your keys apart." }
        scope: { type: string, enum: [read, write] }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, description: Accurate to about a minute. Absent if never used. }
        revoked_at: { type: string, format: date-time }
    ApiKeyCreated:
      type: object
      required: [api_key, token]
      properties:
        api_key: { $ref: "#/components/schemas/ApiKey" }
        token: { type: string, description: "The key itself. Copy it now: we only keep a hash, so it can't be shown again." }
    EventFields:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 20000 }
        venue_name: { type: string, maxLength: 160 }
        venue_address: { type: string, maxLength: 500 }
        timezone: { type: string, description: "An IANA time zone name, like Europe/London." }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time, description: Must be after starts_at. }
        fee_mode: { type: string, enum: [absorb, pass], description: "pass (the default) adds our fee to the buyer's total; absorb takes it out of your price." }
        tax_rate_bp: { type: integer, minimum: 0, maximum: 10000, description: "Tax in basis points: 825 is 8.25%." }
        prices_include_tax: { type: boolean }
    CreateEvent:
      allOf:
        - { $ref: "#/components/schemas/EventFields" }
        - type: object
          required: [slug, name, timezone, starts_at, ends_at]
          properties:
            slug: { type: string, pattern: "^[a-z0-9](-?[a-z0-9])*$", minLength: 3, maxLength: 60, description: Part of the event's web address. It can change while the event is a draft. }
    UpdateEvent:
      allOf:
        - { $ref: "#/components/schemas/EventFields" }
        - type: object
          properties:
            slug: { type: string, pattern: "^[a-z0-9](-?[a-z0-9])*$", minLength: 3, maxLength: 60, description: "Only while the event is a draft; otherwise 409 slug_locked." }
            status: { type: string, enum: [draft, live, ended, cancelled] }
    Event:
      type: object
      required: [id, slug, name, description, venue_name, venue_address, timezone, starts_at, ends_at, status, fee_mode, currency, tax_rate_bp, prices_include_tax, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        venue_name: { type: string }
        venue_address: { type: string }
        timezone: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        status: { type: string, enum: [draft, live, ended, cancelled] }
        fee_mode: { type: string, enum: [absorb, pass] }
        currency: { type: string, enum: [USD] }
        tax_rate_bp: { type: integer }
        prices_include_tax: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    QuotaFields:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        size: { type: integer, minimum: 0, maximum: 1000000, description: How many tickets this capacity holds across all its ticket types. }
        ticket_type_ids: { type: array, items: { type: string, format: uuid }, description: "The ticket types that draw on this capacity. On a patch the list replaces the current one; leave it out to keep it." }
    CreateQuota:
      allOf:
        - { $ref: "#/components/schemas/QuotaFields" }
        - { type: object, required: [name, size], properties: { size: { type: integer, minimum: 0, maximum: 1000000, x-go-type: "*int" } } }
    Quota:
      type: object
      required: [id, event_id, name, size, ticket_type_ids, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        name: { type: string }
        size: { type: integer }
        ticket_type_ids: { type: array, items: { type: string, format: uuid } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PromoCodeFields:
      type: object
      properties:
        code: { type: string, minLength: 3, maxLength: 32, description: "3 to 32 letters, numbers and hyphens. Stored upper-case; unique within the event." }
        kind: { type: string, enum: [percent, amount] }
        value: { type: integer, format: int64, minimum: 0, maximum: 10000000, description: "percent: basis points, 0 to 10000 (1000 is 10%). amount: cents, 0 to 10000000 ($100,000). 0 makes an access code: no discount, so unlocks must not be empty (422 bad_discount), on create and on any patch that sends value or unlocks." }
        max_uses: { type: [integer, "null"], minimum: 1, description: "null means unlimited." }
        valid_from: { type: [string, "null"], format: date-time }
        valid_until: { type: [string, "null"], format: date-time, description: Must be after valid_from. }
        applies_to_all: { type: boolean, description: "true (the default) discounts every ticket type; then applies_to must be empty (422 applies_to_conflict). false limits it to applies_to, which must not be empty (422 applies_to_required). If every listed ticket type is later deleted, the code applies to nothing, never to everything." }
        applies_to: { type: array, items: { type: string, format: uuid }, description: "Ticket types the discount covers when applies_to_all is false. On a patch the list replaces the current one." }
        unlocks: { type: array, items: { type: string, format: uuid }, description: "Hidden ticket types this code reveals. On a patch the list replaces the current one." }
    CreatePromoCode:
      allOf:
        - { $ref: "#/components/schemas/PromoCodeFields" }
        - { type: object, required: [code, kind, value], properties: { code: { type: string, x-go-type: "*string" }, kind: { type: string, enum: [percent, amount], x-go-type: "*string" }, value: { type: integer, format: int64, x-go-type: "*int64" } } }
    PromoCode:
      type: object
      required: [id, event_id, code, kind, value, max_uses, used_count, valid_from, valid_until, applies_to_all, applies_to, unlocks, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        code: { type: string }
        kind: { type: string, enum: [percent, amount] }
        value: { type: integer, format: int64 }
        max_uses: { type: [integer, "null"] }
        used_count: { type: integer, description: Read-only. Checkout counts it. }
        valid_from: { type: [string, "null"], format: date-time }
        valid_until: { type: [string, "null"], format: date-time }
        applies_to_all: { type: boolean }
        applies_to: { type: array, items: { type: string, format: uuid } }
        unlocks: { type: array, items: { type: string, format: uuid } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    QuestionFields:
      type: object
      properties:
        label: { type: string, minLength: 1, maxLength: 200 }
        kind: { type: string, enum: [text, select, checkbox] }
        options: { type: array, items: { type: string, minLength: 1, maxLength: 120 }, description: "A select needs 2 to 30, different ignoring capitals (422 bad_options). Text and checkbox questions have none. On a patch the list replaces the current one." }
        required: { type: boolean, description: Defaults to false. }
        scope: { type: string, enum: [order, ticket], description: "order: asked once per order. ticket: asked for every ticket." }
        applies_to_all: { type: boolean, description: "true (the default) asks it for every ticket type; then applies_to must be empty (422 applies_to_conflict). false limits it to applies_to, which must not be empty (422 applies_to_required). If every listed ticket type is later deleted, the question is never asked." }
        applies_to: { type: array, items: { type: string, format: uuid }, description: "Ticket types the question covers when applies_to_all is false. On a patch the list replaces the current one." }
    CreateQuestion:
      allOf:
        - { $ref: "#/components/schemas/QuestionFields" }
        - { type: object, required: [label, kind, scope], properties: { label: { type: string, x-go-type: "*string" }, kind: { type: string, enum: [text, select, checkbox], x-go-type: "*string" }, scope: { type: string, enum: [order, ticket], x-go-type: "*string" } } }
    Question:
      type: object
      required: [id, event_id, label, kind, options, required, scope, applies_to_all, applies_to, position, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        label: { type: string }
        kind: { type: string, enum: [text, select, checkbox] }
        options: { type: array, items: { type: string } }
        required: { type: boolean }
        scope: { type: string, enum: [order, ticket] }
        applies_to_all: { type: boolean }
        applies_to: { type: array, items: { type: string, format: uuid } }
        position: { type: integer, minimum: 1, description: "1 is first. Change it with the order endpoint." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TicketTypeFields:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        price_cents: { type: integer, format: int64, minimum: 0, maximum: 10000000, description: "In cents: 2500 is $25. Up to $100,000." }
        tax_rate_bp: { type: [integer, "null"], minimum: 0, maximum: 10000, description: "Overrides the event's tax rate. Send null to go back to the event's. Leave it out to keep it as it is." }
        prices_include_tax: { type: [boolean, "null"], description: "Overrides the event's setting. Send null to go back to the event's. Leave it out to keep it as it is." }
        sales_start: { type: [string, "null"], format: date-time }
        sales_end: { type: [string, "null"], format: date-time, description: Must be after sales_start. }
        min_per_order: { type: integer, minimum: 1, maximum: 100, description: "Defaults to 1." }
        max_per_order: { type: integer, minimum: 1, maximum: 100, description: "Defaults to 10. Never below min_per_order." }
        hidden: { type: boolean }
    CreateTicketType:
      allOf:
        - { $ref: "#/components/schemas/TicketTypeFields" }
        - { type: object, required: [name, price_cents], properties: { price_cents: { type: integer, format: int64, minimum: 0, maximum: 10000000, x-go-type: "*int64" }, quota_ids: { type: array, items: { type: string, format: uuid }, description: "Quotas of this event to join. Optional on a draft; a live event needs at least one (409 live_needs_capacity). An id from another event is 422 unknown_quota." } } }
    OrderIds:
      type: object
      required: [ids]
      properties:
        ids: { type: array, items: { type: string, format: uuid } }
    TicketType:
      type: object
      required: [id, event_id, name, description, price_cents, tax_rate_bp, prices_include_tax, sales_start, sales_end, min_per_order, max_per_order, hidden, position, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        price_cents: { type: integer, format: int64 }
        tax_rate_bp: { type: [integer, "null"], description: "null means the event's rate." }
        prices_include_tax: { type: [boolean, "null"], description: "null means the event's setting." }
        sales_start: { type: [string, "null"], format: date-time }
        sales_end: { type: [string, "null"], format: date-time }
        min_per_order: { type: integer }
        max_per_order: { type: integer }
        hidden: { type: boolean }
        position: { type: integer, minimum: 1, description: "1 is first. Change it with the order endpoint." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
