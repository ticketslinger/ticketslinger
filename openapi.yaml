openapi: 3.1.0
info:
  title: TicketSlinger API
  version: 0.1.0
  license: { name: AGPL-3.0-only, identifier: AGPL-3.0-only }
servers:
  - url: https://api.ticketslinger.com/v1
security:
  - session: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
  /auth/signup:
    post:
      operationId: signup
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SignupRequest" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/SessionCreated" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      operationId: login
      description: 401 totp_required means the account has an authenticator app; send totp_code, or a recovery_code instead. A valid recovery code is accepted for any account with a second factor and gives a session that passed it.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SessionCreated" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      operationId: logout
      responses:
        "204": { description: Signed out }
  /auth/verify-email:
    post:
      operationId: verifyEmail
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
      responses:
        "204": { description: Verified }
        "400": { $ref: "#/components/responses/Error" }
  /auth/totp:
    post:
      operationId: startTotp
      description: Starts setting up an authenticator app. Unless this session passed a second factor, send the current password. Once the account has a passkey or an authenticator app, only a session that passed one may start (403 mfa_required). The setup expires if not confirmed within 10 minutes.
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { password: { type: string } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TotpSetup" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /auth/totp/confirm:
    post:
      operationId: confirmTotp
      description: Switches the authenticator app on. Refused (403 mfa_required) if the account gained a passkey since setup started and this session hasn't passed it; a setup older than 10 minutes is 400 totp_not_started.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, pattern: "^[0-9]{6}$" } } } } } }
      responses:
        "204": { description: Enabled }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /auth/recovery-codes:
    post:
      operationId: createRecoveryCodes
      description: Replaces the account's recovery codes with ten new single-use ones and returns them. They are shown this once. Needs a session that passed a second factor (403 mfa_required) and an account that has one (409 no_second_factor).
      responses:
        "200": { description: The new codes, once, content: { application/json: { schema: { type: object, required: [codes], properties: { codes: { type: array, items: { type: string } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/passkeys/register:
    post:
      operationId: beginPasskeyRegistration
      description: Starts adding a passkey. Unless this session passed a second factor, send the current password. Once the account has a passkey or authenticator app, only a session that passed one may add another (403 mfa_required).
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { password: { type: string } } } } } }
      responses:
        "200": { description: Options, content: { application/json: { schema: { $ref: "#/components/schemas/WebAuthnChallenge" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/passkeys/register/{challengeId}:
    post:
      operationId: finishPasskeyRegistration
      parameters:
        - { name: challengeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: name, in: query, required: false, schema: { type: string, maxLength: 120 } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Passkey" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/passkeys/login:
    post:
      operationId: beginPasskeyLogin
      security: []
      responses:
        "200": { description: Options, content: { application/json: { schema: { $ref: "#/components/schemas/WebAuthnChallenge" } } } }
        "429": { $ref: "#/components/responses/Error" }
  /auth/passkeys/login/{challengeId}:
    post:
      operationId: finishPasskeyLogin
      security: []
      parameters: [{ name: challengeId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SessionCreated" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /me:
    get:
      operationId: getMe
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /organizers:
    get:
      operationId: listOrganizers
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Organizer" } } } } }
    post:
      operationId: createOrganizer
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateOrganizer" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Organizer" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}:
    get:
      operationId: getOrganizer
      parameters: [{ $ref: "#/components/parameters/OrganizerPath" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Organizer" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/audit:
    get:
      operationId: listAudit
      parameters: [{ $ref: "#/components/parameters/OrganizerPath" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/api-keys:
    get:
      operationId: listApiKeys
      description: Owners and admins only, from a signed-in session. An API key gets 403 session_required.
      parameters: [{ $ref: "#/components/parameters/OrganizerPath" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ApiKey" } } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createApiKey
      description: Owners and admins only, from a signed-in session. The token is in this response and nowhere else, ever.
      parameters: [{ $ref: "#/components/parameters/OrganizerPath" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateApiKey" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ApiKeyCreated" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/api-keys/{apiKey}:
    delete:
      operationId: revokeApiKey
      description: Owners and admins only, from a signed-in session. The key stops working at once; revoking it again changes nothing.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { name: apiKey, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events:
    get:
      operationId: listEvents
      description: Any member, or any API key. Soonest first.
      parameters: [{ $ref: "#/components/parameters/OrganizerPath" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Event" } } } } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createEvent
      description: Owners and admins, or a write API key. The event starts as a draft.
      parameters: [{ $ref: "#/components/parameters/OrganizerPath" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateEvent" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}:
    get:
      operationId: getEvent
      description: Any member, or any API key.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateEvent
      description: "Owners and admins, or a write API key. Send only what changes. status moves between draft and live; ended and cancelled aren't available yet (422 status_not_allowed)."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateEvent" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteEvent
      description: Owners and admins, or a write API key. Drafts only; a live event answers 409 event_not_draft.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/ticket-types:
    get:
      operationId: listTicketTypes
      description: Any member, or any API key. In position order.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TicketType" } } } } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createTicketType
      description: Owners and admins, or a write API key. It goes to the end of the list. price_cents is required (422 missing_field).
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateTicketType" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/TicketType" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/ticket-types/{ticketType}:
    get:
      operationId: getTicketType
      description: Any member, or any API key.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/TicketTypePath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TicketType" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateTicketType
      description: Owners and admins, or a write API key. Send only what changes.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/TicketTypePath" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TicketTypeFields" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TicketType" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteTicketType
      description: Owners and admins, or a write API key. The last ticket type of a live event answers 409 last_ticket_type_live.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/TicketTypePath" }
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/quotas:
    get:
      operationId: listQuotas
      description: Any member, or any API key. Oldest first.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Quota" } } } } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createQuota
      description: Owners and admins, or a write API key. size is required (422 missing_field). ticket_type_ids may be empty; every id must belong to this event (422 unknown_ticket_type).
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateQuota" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Quota" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/quotas/{quota}:
    get:
      operationId: getQuota
      description: Any member, or any API key.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/QuotaPath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Quota" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateQuota
      description: "Owners and admins, or a write API key. Send only what changes. A ticket_type_ids list replaces the whole set. On a live event, leaving a ticket type in no quota answers 409 live_needs_capacity."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/QuotaPath" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/QuotaFields" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Quota" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteQuota
      description: Owners and admins, or a write API key. On a live event, a delete that leaves a ticket type in no quota answers 409 live_needs_capacity.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/QuotaPath" }
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    session: { type: http, scheme: bearer, description: "A session token, or an organizer API key (tsk_...). A key acts only within its own organizer, and gets 403 session_required on anything that needs a person: your account, your organizer list, the audit log and key management. A read key gets 403 scope_read_only on writes." }
  parameters:
    OrganizerPath: { name: organizer, in: path, required: true, schema: { type: string } }
    QuotaPath: { name: quota, in: path, required: true, schema: { type: string, format: uuid } }
    TicketTypePath: { name: ticketType, in: path, required: true, schema: { type: string, format: uuid } }
    EventPath: { name: event, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Error: { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: { code: { type: string }, message: { type: string } }
    Health: { type: object, required: [status], properties: { status: { type: string } } }
    SignupRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 256 }
        name: { type: string, minLength: 1, maxLength: 120 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        totp_code: { type: string, pattern: "^[0-9]{6}$" }
        recovery_code: { type: string, maxLength: 32, description: "One of the account's unused recovery codes, in place of an authenticator code or passkey. Spaces, hyphens and case don't matter. Sending it together with totp_code is 422 one_second_step." }
    SessionCreated:
      type: object
      required: [session_token, user]
      properties: { session_token: { type: string }, user: { $ref: "#/components/schemas/Me" } }
    Me:
      type: object
      required: [id, email, name, email_verified, totp_enabled, has_passkey, has_second_factor, mfa]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        email_verified: { type: boolean }
        totp_enabled: { type: boolean }
        has_passkey: { type: boolean }
        has_second_factor: { type: boolean, description: Whether the account has a passkey or an authenticator app. }
        mfa: { type: boolean, description: Whether this session passed a second factor or a passkey. }
    TotpSetup:
      type: object
      required: [secret, otpauth_url]
      properties: { secret: { type: string }, otpauth_url: { type: string } }
    WebAuthnChallenge:
      type: object
      required: [challenge_id, options]
      properties: { challenge_id: { type: string, format: uuid }, options: { type: object, additionalProperties: true } }
    Passkey:
      type: object
      required: [id, name, created_at]
      properties: { id: { type: string, format: uuid }, name: { type: string }, created_at: { type: string, format: date-time } }
    CreateOrganizer:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, pattern: "^[a-z0-9](-?[a-z0-9])*$", minLength: 3, maxLength: 40 }
    Organizer:
      type: object
      required: [id, name, slug, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        role: { type: string, enum: [owner, admin, checkin, "key:read", "key:write"], description: "Your role here. An API key sees its own scope as key:read or key:write." }
    AuditEntry:
      type: object
      required: [id, action, entity_type, entity_id, at]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid }
        actor_user_id: { type: string, format: uuid }
        actor_api_key_id: { type: string, format: uuid, description: Set instead of actor_user_id when an API key did it. }
        at: { type: string, format: date-time }
    CreateApiKey:
      type: object
      required: [name, scope]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        scope: { type: string, enum: [read, write], description: "write can also read." }
    ApiKey:
      type: object
      required: [id, name, prefix, scope, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: "The first 8 characters after tsk_, so you can tell your keys apart." }
        scope: { type: string, enum: [read, write] }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, description: Accurate to about a minute. Absent if never used. }
        revoked_at: { type: string, format: date-time }
    ApiKeyCreated:
      type: object
      required: [api_key, token]
      properties:
        api_key: { $ref: "#/components/schemas/ApiKey" }
        token: { type: string, description: "The key itself. Copy it now: we only keep a hash, so it can't be shown again." }
    EventFields:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 20000 }
        venue_name: { type: string, maxLength: 160 }
        venue_address: { type: string, maxLength: 500 }
        timezone: { type: string, description: "An IANA time zone name, like Europe/London." }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time, description: Must be after starts_at. }
        fee_mode: { type: string, enum: [absorb, pass], description: "pass (the default) adds our fee to the buyer's total; absorb takes it out of your price." }
        tax_rate_bp: { type: integer, minimum: 0, maximum: 10000, description: "Tax in basis points: 825 is 8.25%." }
        prices_include_tax: { type: boolean }
    CreateEvent:
      allOf:
        - { $ref: "#/components/schemas/EventFields" }
        - type: object
          required: [slug, name, timezone, starts_at, ends_at]
          properties:
            slug: { type: string, pattern: "^[a-z0-9](-?[a-z0-9])*$", minLength: 3, maxLength: 60, description: Part of the event's web address. It can change while the event is a draft. }
    UpdateEvent:
      allOf:
        - { $ref: "#/components/schemas/EventFields" }
        - type: object
          properties:
            slug: { type: string, pattern: "^[a-z0-9](-?[a-z0-9])*$", minLength: 3, maxLength: 60, description: "Only while the event is a draft; otherwise 409 slug_locked." }
            status: { type: string, enum: [draft, live, ended, cancelled] }
    Event:
      type: object
      required: [id, slug, name, description, venue_name, venue_address, timezone, starts_at, ends_at, status, fee_mode, currency, tax_rate_bp, prices_include_tax, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        venue_name: { type: string }
        venue_address: { type: string }
        timezone: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        status: { type: string, enum: [draft, live, ended, cancelled] }
        fee_mode: { type: string, enum: [absorb, pass] }
        currency: { type: string, enum: [USD] }
        tax_rate_bp: { type: integer }
        prices_include_tax: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    QuotaFields:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        size: { type: integer, minimum: 0, maximum: 1000000, description: How many tickets this capacity holds across all its ticket types. }
        ticket_type_ids: { type: array, items: { type: string, format: uuid }, description: "The ticket types that draw on this capacity. On a patch the list replaces the current one; leave it out to keep it." }
    CreateQuota:
      allOf:
        - { $ref: "#/components/schemas/QuotaFields" }
        - { type: object, required: [name, size], properties: { size: { type: integer, minimum: 0, maximum: 1000000, x-go-type: "*int" } } }
    Quota:
      type: object
      required: [id, event_id, name, size, ticket_type_ids, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        name: { type: string }
        size: { type: integer }
        ticket_type_ids: { type: array, items: { type: string, format: uuid } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TicketTypeFields:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        price_cents: { type: integer, format: int64, minimum: 0, maximum: 10000000, description: "In cents: 2500 is $25. Up to $100,000." }
        tax_rate_bp: { type: [integer, "null"], minimum: 0, maximum: 10000, description: "Overrides the event's tax rate. Send null to go back to the event's. Leave it out to keep it as it is." }
        prices_include_tax: { type: [boolean, "null"], description: "Overrides the event's setting. Send null to go back to the event's. Leave it out to keep it as it is." }
        sales_start: { type: [string, "null"], format: date-time }
        sales_end: { type: [string, "null"], format: date-time, description: Must be after sales_start. }
        min_per_order: { type: integer, minimum: 1, maximum: 100, description: "Defaults to 1." }
        max_per_order: { type: integer, minimum: 1, maximum: 100, description: "Defaults to 10. Never below min_per_order." }
        hidden: { type: boolean }
    CreateTicketType:
      allOf:
        - { $ref: "#/components/schemas/TicketTypeFields" }
        - { type: object, required: [name, price_cents], properties: { price_cents: { type: integer, format: int64, minimum: 0, maximum: 10000000, x-go-type: "*int64" }, quota_ids: { type: array, items: { type: string, format: uuid }, description: "Quotas of this event to join. Optional on a draft; a live event needs at least one (409 live_needs_capacity). An id from another event is 422 unknown_quota." } } }
    TicketType:
      type: object
      required: [id, event_id, name, description, price_cents, tax_rate_bp, prices_include_tax, sales_start, sales_end, min_per_order, max_per_order, hidden, position, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        price_cents: { type: integer, format: int64 }
        tax_rate_bp: { type: [integer, "null"], description: "null means the event's rate." }
        prices_include_tax: { type: [boolean, "null"], description: "null means the event's setting." }
        sales_start: { type: [string, "null"], format: date-time }
        sales_end: { type: [string, "null"], format: date-time }
        min_per_order: { type: integer }
        max_per_order: { type: integer }
        hidden: { type: boolean }
        position: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
