openapi: 3.1.0
info:
  title: TicketSlinger API
  version: 0.1.0
  license: { name: AGPL-3.0-only, identifier: AGPL-3.0-only }
  description: |
    Every POST, PUT, PATCH and DELETE accepts an Idempotency-Key header: 1 to 255 printable ASCII characters, a fresh random value per intended action (400 bad_idempotency_key otherwise). Send the same key to retry and nothing happens twice. The first response is kept for 24 hours and replayed with Idempotent-Replayed: true. Keys belong to the caller (the signed-in user, the API key, or nobody for public calls) and to the method and path, so they never cross between callers. The same key with a different body is 422 idempotency_key_reused. The same key while the first request is still running is 409 idempotency_in_progress; wait a moment and retry. Responses with a 5xx status, and 429 rate-limit answers, are not kept, so a retry runs fresh; 409 idempotency_in_progress carries Retry-After: 1. Operations that hand back credentials (sign-up, sign-in, authenticator setup, recovery codes, API key creation, Stripe onboarding and account-linking links, checkout tokens and payment client secrets) never keep their responses, so a retry runs again. Without signing in, the key must be random and at least 22 letters, digits, - or _ (a UUID works). Busy moments on a sale answer 503 try_again with Retry-After: 1.
servers:
  - url: https://api.ticketslinger.com/v1
security:
  - session: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
  /auth/signup:
    post:
      operationId: signup
      x-idempotency-store: false
      description: "When the server has Turnstile on, send a turnstile_token: a missing or refused one is 422 turnstile_failed, and 503 turnstile_unavailable means Cloudflare couldn't check it just now, so try again with a fresh token. Its response carries credentials, so it is never kept for replay, so a retry with the same Idempotency-Key runs again, and a duplicate sent while the first is running is 409 idempotency_in_progress."
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SignupRequest" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/SessionCreated" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      operationId: login
      x-idempotency-store: false
      description: "401 totp_required means the account has an authenticator app; send totp_code, or a recovery_code instead. Every attempt that doesn't sign in counts, per email and client address (an IPv6 /64 counts as one address), whether or not the email has an account, and including attempts refused for a missing or bad token. After three from one address, that address must send a turnstile_token when the server has Turnstile on (401 turnstile_required; 422 turnstile_failed when it's refused; 503 turnstile_unavailable when Cloudflare can't check it). The fifth locks that address out for 15 minutes (423 locked). Ten across all addresses put every sign-in for that email behind Turnstile, from any address, without locking it; on a server running without Turnstile they slow that email to one attempt every 10 seconds instead, across all addresses (429 rate_limited with Retry-After: 10, not counted as an attempt). Counts keep adding up until 15 minutes pass without an attempt; signing in clears that address's count. A valid recovery code is accepted for any account with a second factor and gives a session that passed it. Its response carries credentials, so it is never kept for replay, so a retry with the same Idempotency-Key runs again, and a duplicate sent while the first is running is 409 idempotency_in_progress."
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SessionCreated" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      operationId: logout
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/verify-email:
    post:
      operationId: verifyEmail
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
      responses:
        "204": { description: Verified }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/totp:
    post:
      operationId: startTotp
      x-idempotency-store: false
      description: Starts setting up an authenticator app. Unless this session passed a second factor, send the current password. Once the account has a passkey or an authenticator app, only a session that passed one may start (403 mfa_required). The setup expires if not confirmed within 10 minutes. Its response carries credentials, so it is never kept for replay, so a retry with the same Idempotency-Key runs again, and a duplicate sent while the first is running is 409 idempotency_in_progress.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { password: { type: string } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TotpSetup" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/totp/confirm:
    post:
      operationId: confirmTotp
      description: Switches the authenticator app on. Refused (403 mfa_required) if the account gained a passkey since setup started and this session hasn't passed it; a setup older than 10 minutes is 400 totp_not_started.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, pattern: "^[0-9]{6}$" } } } } } }
      responses:
        "204": { description: Enabled }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/recovery-codes:
    post:
      operationId: createRecoveryCodes
      x-idempotency-store: false
      description: Replaces the account's recovery codes with ten new single-use ones and returns them. They are shown this once. Needs a session that passed a second factor (403 mfa_required) and an account that has one (409 no_second_factor). Its response carries credentials, so it is never kept for replay, so a retry with the same Idempotency-Key runs again, and a duplicate sent while the first is running is 409 idempotency_in_progress.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: "The new codes, once", content: { application/json: { schema: { type: object, required: [codes], properties: { codes: { type: array, items: { type: string } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/passkeys/register:
    post:
      operationId: beginPasskeyRegistration
      description: Starts adding a passkey. Unless this session passed a second factor, send the current password. Once the account has a passkey or authenticator app, only a session that passed one may add another (403 mfa_required).
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { password: { type: string } } } } } }
      responses:
        "200": { description: Options, content: { application/json: { schema: { $ref: "#/components/schemas/WebAuthnChallenge" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/passkeys/register/{challengeId}:
    post:
      operationId: finishPasskeyRegistration
      parameters:
        - { name: challengeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: name, in: query, required: false, schema: { type: string, maxLength: 120 } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Passkey" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/passkeys/login:
    post:
      operationId: beginPasskeyLogin
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: Options, content: { application/json: { schema: { $ref: "#/components/schemas/WebAuthnChallenge" } } } }
        "429": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/passkeys/login/{challengeId}:
    post:
      operationId: finishPasskeyLogin
      x-idempotency-store: false
      description: "Its response carries credentials, so it is never kept for replay, so a retry with the same Idempotency-Key runs again, and a duplicate sent while the first is running is 409 idempotency_in_progress."
      security: []
      parameters: [{ name: challengeId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SessionCreated" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /me:
    get:
      operationId: getMe
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /organizers:
    get:
      operationId: listOrganizers
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Organizer" } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createOrganizer
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateOrganizer" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Organizer" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}:
    get:
      operationId: getOrganizer
      parameters: [{ $ref: "#/components/parameters/OrganizerPath" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Organizer" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/audit:
    get:
      operationId: listAudit
      parameters: [{ $ref: "#/components/parameters/OrganizerPath" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/api-keys:
    get:
      operationId: listApiKeys
      description: Owners and admins only, from a signed-in session. An API key gets 403 session_required.
      parameters: [{ $ref: "#/components/parameters/OrganizerPath" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ApiKey" } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createApiKey
      x-idempotency-store: false
      description: Owners and admins only, from a signed-in session. The token is in this response and nowhere else, ever. Its response carries credentials, so it is never kept for replay, so a retry with the same Idempotency-Key runs again, and a duplicate sent while the first is running is 409 idempotency_in_progress.
      parameters: [{ $ref: "#/components/parameters/OrganizerPath" }, { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateApiKey" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ApiKeyCreated" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/api-keys/{apiKey}:
    delete:
      operationId: revokeApiKey
      description: Owners and admins only, from a signed-in session. The key stops working at once; revoking it again changes nothing.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { name: apiKey, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/members:
    get:
      operationId: listMembers
      description: Owners and admins only, from a signed-in session. Everyone on the organizer's team and their role. An API key gets 403 session_required.
      parameters: [{ $ref: "#/components/parameters/OrganizerPath" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Member" } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: addMember
      description: "Owners only, from a signed-in session. Adds an existing, verified TicketSlinger account to the team as admin or checkin; nobody is emailed. 404 no_account when no verified account has that email (an unknown email and an unverified one get the same answer). 409 already_member when they're on the team already, in any role. 422 with field role for any role but admin or checkin: owners can't be made here."
      parameters: [{ $ref: "#/components/parameters/OrganizerPath" }, { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AddMember" } } } }
      responses:
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/Member" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/members/{member}:
    delete:
      operationId: removeMember
      description: "Owners only, from a signed-in session. Takes an admin or check-in member off the team; they lose access at once. 409 cannot_remove for an owner or for yourself. 404 when they aren't on the team."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { name: member, in: path, required: true, schema: { type: string, format: uuid }, description: The member's user_id. }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/payments:
    get:
      operationId: getPayments
      description: Any member, or any API key. Whether this organizer can take card payments. provider is none when the server has no payment provider set up; paid tickets can't be sold until it has one and charges_enabled is true.
      parameters: [{ $ref: "#/components/parameters/OrganizerPath" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentsStatus" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/payments/connect:
    post:
      operationId: connectPayments
      x-idempotency-store: false
      description: "Owners and admins only, from a signed-in session. Creates the organizer's Stripe account the first time (a Standard account: the organizer gets the full Stripe dashboard and deals with Stripe directly), then returns a one-time Stripe onboarding link. Send the person there; Stripe brings them back to /o/{organizer}/payments?return=1 when they finish, or ?refresh=1 when the link has expired. Calling it again reuses the same account, and so does calling it after disconnecting an account created here: that only switches it back on. After disconnecting a linked account, it creates a new one. Its response carries a one-time onboarding link, so we never keep it: a retry with the same key runs again, and a duplicate sent while the first is running gets 409 idempotency_in_progress. 409 already_connected while a linked account is connected (disconnect it first); 409 account_in_use when the account it would switch back on is now taking payments for another organizer. 409 direct_payments when the server takes payments through its own Stripe account (mode direct). 503 payments_not_configured when the server has no payment provider; 503 payments_unavailable when Stripe can't be reached or had a problem of its own (try again); 503 payments_refused when Stripe answered and turned the request down (trying again won't help; the details are in the server log)."
      parameters: [{ $ref: "#/components/parameters/OrganizerPath" }, { $ref: "#/components/parameters/IdempotencyKey" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingLink" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/payments/refresh:
    post:
      operationId: refreshPayments
      description: "Owners and admins, or a write API key. Asks Stripe for the account's current state and saves it; call it when someone comes back from onboarding. 409 not_connected before the first connect and while disconnected; 409 direct_payments when the server takes payments through its own Stripe account (mode direct); 503 payments_not_configured when the server has no payment provider; 503 payments_unavailable when Stripe can't be reached or had a problem of its own; 503 payments_refused when Stripe turned the request down."
      parameters: [{ $ref: "#/components/parameters/OrganizerPath" }, { $ref: "#/components/parameters/IdempotencyKey" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentsStatus" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/payments/link:
    post:
      operationId: startStripeLink
      x-idempotency-store: false
      description: "Owners and admins only, from a signed-in session. Starts linking a Stripe account the organizer already has, through Stripe Connect OAuth: send the person to url, and Stripe sends them back to the dashboard's /stripe/oauth/callback with code and state, which go to /stripe/link/complete. The state works once, for ten minutes, from this session only. Its response carries that state, so we never keep it: a retry with the same key runs again, and a duplicate sent while the first is running gets 409 idempotency_in_progress. 409 already_connected while the organizer has a connected account (disconnect it first); 409 direct_payments when the server takes payments through its own Stripe account (mode direct); 503 oauth_not_configured when this server can't link existing accounts (can_link_existing is false); 503 payments_not_configured when the server has no payment provider."
      parameters: [{ $ref: "#/components/parameters/OrganizerPath" }, { $ref: "#/components/parameters/IdempotencyKey" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/StripeLinkStart" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/payments/disconnect:
    post:
      operationId: disconnectPayments
      description: "Owners and admins only, from a signed-in session. Stops taking card payments through the organizer's Stripe account. A linked account has our access removed at Stripe first (503 payments_unavailable or payments_refused if Stripe can't do that, and nothing changes); an account created here stays the organizer's, and we just stop selling through it. Orders already taken stay as they are, and paid tickets go off sale until the organizer connects again. 409 not_connected when there's no connected account; 409 payments_in_progress while a buyer is in the middle of paying (try again in a few minutes); 409 direct_payments when the server takes payments through its own Stripe account (mode direct)."
      parameters: [{ $ref: "#/components/parameters/OrganizerPath" }, { $ref: "#/components/parameters/IdempotencyKey" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentsStatus" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /stripe/link/complete:
    post:
      operationId: completeStripeLink
      description: "The signed-in person who started the link, from the same session. Finishes linking with the code and state Stripe sent back; the state names the organizer. Owners and admins only, as for any payments change (403 forbidden_role, 403 mfa_required). 400 invalid_state when the state is unknown, already used, more than ten minutes old, or was started by another session; a failed attempt uses it up too, so start again. 409 account_in_use when that Stripe account is already taking payments for another organizer here. 503 payments_unavailable when Stripe can't be reached; 503 payments_refused when Stripe turned the code down. 422 too_long (field state or code) for values longer than Stripe ever sends."
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StripeLinkComplete" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/StripeLinked" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events:
    get:
      operationId: listEvents
      description: Any member, or any API key. Soonest first.
      parameters: [{ $ref: "#/components/parameters/OrganizerPath" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Event" } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createEvent
      description: Owners and admins, or a write API key. The event starts as a draft. starts_at and ends_at are required (422 missing_field).
      parameters: [{ $ref: "#/components/parameters/OrganizerPath" }, { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateEvent" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}:
    get:
      operationId: getEvent
      description: Any member, or any API key.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateEvent
      description: "Owners and admins, or a write API key. Send only what changes. status moves between draft and live (422 status_not_allowed otherwise): cancelling has its own operation, cancelEvent, because it refunds everyone, and ending isn't available yet. Going live is refused with 422 event_over once ends_at has passed (an event that has started but not ended can go live), 422 no_ticket_types without a ticket type, 422 unquotaed_ticket_type while a ticket type has no quota, and 422 payments_not_ready when any ticket type costs money and the organizer's Stripe account can't take payments yet (see /organizers/{organizer}/payments). A live event's ends_at can still change. The slug changes only on a draft (409 slug_locked). Once tickets are sold or held in an open checkout, tax_rate_bp, prices_include_tax, fee_mode and timezone can't change and the event can't go back to draft (409 has_sales; any order counts, even one without tickets); field names the property refused."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateEvent" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteEvent
      description: Owners and admins, or a write API key. Drafts only; a live event answers 409 event_not_draft, and a draft with orders answers 409 has_sales.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/ticket-types:
    get:
      operationId: listTicketTypes
      description: Any member, or any API key. In position order.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TicketType" } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createTicketType
      description: Owners and admins, or a write API key. It goes to the end of the list. price_cents is required (422 missing_field).
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateTicketType" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/TicketType" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/ticket-types/order:
    put:
      operationId: reorderTicketTypes
      description: "Owners and admins, or a write API key. Send every ticket type id of this event once, in the order you want; they take positions 1 to n together, or none changes. Anything else, a missing, repeated or foreign id included, is 422 order_mismatch. The same order again changes nothing. Returns the list."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrderIds" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TicketType" } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/ticket-types/{ticketType}:
    get:
      operationId: getTicketType
      description: Any member, or any API key.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/TicketTypePath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TicketType" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateTicketType
      description: "Owners and admins, or a write API key. Send only what changes. Showing a hidden ticket type that a promo code unlocks answers 409 unlocked_by_promo. Once this ticket type is sold or held in an open checkout, price_cents, tax_rate_bp, prices_include_tax, min_per_order and max_per_order can't change (409 has_sales); name, description, the sales window and hidden still can."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/TicketTypePath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TicketTypeFields" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TicketType" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteTicketType
      description: Owners and admins, or a write API key. The last ticket type of a live event answers 409 last_ticket_type_live. One that has been sold, or is held in an open checkout, answers 409 has_sales.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/TicketTypePath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/quotas:
    get:
      operationId: listQuotas
      description: Any member, or any API key. Oldest first.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Quota" } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createQuota
      description: Owners and admins, or a write API key. size is required (422 missing_field). ticket_type_ids may be empty; every id must belong to this event (422 unknown_ticket_type). A size below what those ticket types have already sold and hold in open checkouts answers 409 quota_below_sales.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateQuota" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Quota" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/quotas/{quota}:
    get:
      operationId: getQuota
      description: Any member, or any API key.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/QuotaPath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Quota" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateQuota
      description: "Owners and admins, or a write API key. Send only what changes. A ticket_type_ids list replaces the whole set. On a live event, leaving a ticket type in no quota answers 409 live_needs_capacity. size can grow at any time but can't drop below what its ticket types have sold and hold in open checkouts, counting any ticket type the patch adds (409 quota_below_sales). A ticket type with sales can't leave the set (409 has_sales)."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/QuotaPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/QuotaFields" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Quota" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteQuota
      description: Owners and admins, or a write API key. On a live event, a delete that leaves a ticket type in no quota answers 409 live_needs_capacity. A quota whose ticket types have sales, or are held in an open checkout, answers 409 has_sales.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/QuotaPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/orders:
    get:
      operationId: listOrders
      description: Owners and admins, or any API key; check-in staff get 403 forbidden_role, because orders show what people paid. The event's orders, newest first. Orders still waiting for payment aren't listed. email is the buyer's address.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OrderSummary" } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/orders/{order}:
    get:
      operationId: getOrderDetail
      description: Owners and admins, or any API key; check-in staff get 403 forbidden_role, as for listOrders. One order with every ticket it ever had (refunded ones show as void, with the refund that covered them) and its refunds, newest first. email is the buyer's address.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/OrderPath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OrderDetail" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/orders/{order}/refunds:
    post:
      operationId: refundOrder
      description: "Owners and admins, signed in with a passkey or authenticator app (403 session_required for an API key, 403 forbidden_role for other members, 403 mfa_required without one). Name the tickets in ticket_ids, or leave it out to refund every ticket still valid. The buyer gets back what they paid for those tickets; with refund_fee true our fee on them goes back too, to the buyer when they paid it and to you when you absorbed it. Those tickets stop scanning straight away, and their seats go back on sale once the refund goes through. A ticket that cost nothing is cancelled and its seat freed at once, with no refund (refund is null). 409 not_refundable when nothing is left to refund. 422 bad_tickets (field ticket_ids) when a ticket isn't in this order or is refunded already, or the list is empty or null; 422 too_many over 100 tickets; 422 missing_field without refund_fee; 422 fee_without_refund (field refund_fee) when the tickets cost nothing but refund_fee is true. 404 for an order that isn't this event's."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/OrderPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RefundOrderRequest" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/RefundResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/orders/{order}/refunds/{refund}/retry:
    post:
      operationId: retryRefund
      description: "Owners and admins, signed in with a passkey or authenticator app (403 session_required for an API key, 403 forbidden_role for other members, 403 mfa_required without one). Sends a failed refund again: the same refund, for the same money, back to requested. Before it asks Stripe again, we check whether Stripe made the first one after all; if it did, we use that one instead of sending a second. Its tickets keep their seats until it goes through. 409 not_failed unless the refund failed. 409 no_room when other refunds on the order have since taken what this one needs. 404 for a refund that isn't this order's."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/OrderPath" }
        - { $ref: "#/components/parameters/RefundPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Refund" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/orders/{order}/email:
    post:
      operationId: resendTicketEmail
      description: "Owners and admins, or a write API key. Sends the order's ticket email again: the same tickets and the same order link, to the address the buyer gave. It goes out from the queue, so this answers 202 with ticket_email queued; the order shows how it went. 409 email_on_its_way while the last one is still queued or being retried. 409 too_soon within 10 minutes of the last time it was asked for (by you, by the buyer, or by the sale itself). 409 no_tickets when the order has no valid ticket left."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/OrderPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "202": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/OrderEmail" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/cancel:
    post:
      operationId: cancelEvent
      description: "Owners and admins, signed in with a passkey or authenticator app (403 session_required for an API key, 403 forbidden_role for other members, 403 mfa_required without one). Takes a live event off sale for good and refunds every paid order in full, our fee included, whoever paid it. Every ticket stops scanning straight away. A payment that's still going through is stopped at Stripe, and one that lands anyway is refunded in full. There's no undo, so confirm_name must be the event's name exactly as it's shown (spaces around it don't matter): 422 confirm_mismatch (field confirm_name) otherwise. 409 event_not_live unless the event is on sale. orders, amount_cents and fee_cents add up the refunds this asked Stripe for; each one goes through on its own, as with refundOrder."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CancelEventRequest" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CancelEventResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/checkins:
    post:
      operationId: createCheckin
      description: "Owners, admins and check-in staff, or a write API key. Checks one ticket in: send the scanned QR text as qr, or a ticket picked by hand as ticket_id, never both (422 qr_or_ticket). Every outcome is a 200, and result says which it was. accepted: the ticket is valid and wasn't in yet, so it's in now. duplicate: it's already in, and ticket.checked_in_at says since when. invalid: no ticket of this event matches, so ticket is null. void: the ticket was refunded or cancelled. checked_in and sold count the event's valid tickets. Retrying with the same Idempotency-Key replays the first answer, so a scan resent after a dropped connection still says accepted. 422 (field qr) for an empty or over-long qr, (field gate) for a gate over 40 characters. 429 rate_limited after 300 scans in a minute from one caller at one event."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateCheckin" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CheckinResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/checkins/search:
    get:
      operationId: searchCheckinTickets
      description: "Any member, or any API key. Finds up to 20 of the event's tickets by attendee name or buyer email (any part, any case) or by order code (with or without TS-), valid tickets first, then by name. The email only finds tickets; it never comes back. 422 (field q) if q is over 120 characters, or under 2 once spaces around it are dropped. 429 rate_limited after 600 searches in a minute from one caller at one event."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 120 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CheckinTicket" } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/checkins/summary:
    get:
      operationId: getCheckinSummary
      description: Any member, or any API key. How many of the event's valid tickets are checked in, out of how many sold.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CheckinSummary" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/report:
    get:
      operationId: getEventReport
      description: "Owners and admins, or any API key; check-in members get 403 forbidden_role. The event's sales, refunds and our fee, from live data in one snapshot. Money counts the orders listOrders lists (paid, confirmed free, or paid late after being cancelled), so the totals match it; refunded_cents counts every refund that hasn't failed, and platform_fee_cents is our fee on succeeded payments less the fee that has gone back. net_cents = gross_cents - refunded_cents - platform_fee_cents, before Stripe's processing fees."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EventReport" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/exports/{kind}:
    get:
      operationId: exportEventCsv
      description: "Owners and admins, or any API key; check-in members get 403 forbidden_role. The event's orders, attendees (one row per ticket, any status, then a column per question) or check-ins as CSV: UTF-8 with a BOM, CRLF line ends, times in the event's time zone with their offset, money like 25.00. A cell that starts with =, +, -, @, tab or CR gets a leading ' so spreadsheets don't run it. It comes with Content-Disposition: attachment; filename=\"<event-slug>-<kind>\" and Cache-Control: no-store. 400 unknown_export for any other kind."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [orders.csv, attendees.csv, checkins.csv] } }
      responses:
        "200":
          description: OK
          headers:
            Content-Disposition: { required: true, schema: { type: string } }
          content: { "text/csv; charset=utf-8": { schema: { type: string } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/promo-codes:
    get:
      operationId: listPromoCodes
      description: Any member, or any API key. Oldest first.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PromoCode" } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createPromoCode
      description: "Owners and admins, or a write API key. code, kind and value are required (422 missing_field). The code is trimmed and upper-cased, and is unique within the event (409 code_taken). Every id in applies_to and unlocks must be a ticket type of this event (422 unknown_ticket_type); unlocks may list only hidden ones (422 unlock_not_hidden)."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreatePromoCode" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PromoCode" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/promo-codes/{promoCode}:
    get:
      operationId: getPromoCode
      description: Any member, or any API key.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/PromoCodePath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PromoCode" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updatePromoCode
      description: "Owners and admins, or a write API key. Send only what changes. Changing kind needs value too (422 value_required_with_kind). applies_to and unlocks replace the whole set when sent. null clears max_uses, valid_from or valid_until; leaving one out keeps it. used_count can't be set. Once an order has used the code, or an open checkout is using it, kind, value, applies_to_all and applies_to can't change (409 has_sales; field names the first one)."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/PromoCodePath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PromoCodeFields" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PromoCode" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deletePromoCode
      description: Owners and admins, or a write API key. A code an order has used, or an open checkout is using, answers 409 has_sales.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/PromoCodePath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/questions:
    get:
      operationId: listQuestions
      description: Any member, or any API key. In position order.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Question" } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createQuestion
      description: "Owners and admins, or a write API key. label, kind and scope are required (422 missing_field). The question goes at the end of the list. Every id in applies_to must be a ticket type of this event (422 unknown_ticket_type)."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateQuestion" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Question" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/questions/order:
    put:
      operationId: reorderQuestions
      description: "Owners and admins, or a write API key. Send every question id of this event once, in the order you want; they take positions 1 to n together, or none changes. Anything else, a missing, repeated or foreign id included, is 422 order_mismatch. The same order again changes nothing. Returns the list."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrderIds" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Question" } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /organizers/{organizer}/events/{event}/questions/{question}:
    get:
      operationId: getQuestion
      description: Any member, or any API key.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/QuestionPath" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Question" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateQuestion
      description: "Owners and admins, or a write API key. Send only what changes. Turning a question into a select needs options in the same request (422 options_required_with_kind); turning a select into anything else clears its options. applies_to replaces the whole set when sent. Order changes only through the order endpoint."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/QuestionPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/QuestionFields" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Question" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteQuestion
      description: Owners and admins, or a write API key. A question buyers have answered answers 409 has_sales.
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { $ref: "#/components/parameters/EventPath" }
        - { $ref: "#/components/parameters/QuestionPath" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /storefront/{organizer}/{eventSlug}:
    get:
      operationId: getStorefrontEvent
      security: []
      description: "Anyone. A live event as buyers see it, by its storefront address; a draft or unknown event is 404. Hidden ticket types show only with a code that unlocks them (unlocked is true on those), and so do questions asked only of hidden types. promo is the code's terms when it works right now, and null otherwise: a code that doesn't work is simply no code here. state is ended once ends_at has passed, and then nothing is on sale. remaining counts what's sold and held right now. Reads that send a code count against the client address, 30 a minute (an IPv6 /64 counts as one), then 429 rate_limited; reads without one are never limited."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { name: eventSlug, in: path, required: true, schema: { type: string } }
        - { name: code, in: query, required: false, schema: { type: string }, description: "A promo or access code, as the buyer typed it." }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/StorefrontEvent" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /storefront/{organizer}/{eventSlug}/order-links:
    post:
      operationId: requestOrderLinks
      security: []
      description: "Anyone. Emails a fresh link to every order this address has for the event, and each old link stops working. The answer is 204 whether or not the address bought anything, and nothing is sent to an address with no orders. An order whose link was sent in the last 10 minutes keeps it. 422 bad_email (field email). When the server has Turnstile on, send a turnstile_token: a missing or refused one is 422 turnstile_failed, and 503 turnstile_unavailable means Cloudflare couldn't check it just now. 5 requests an hour per client address (an IPv6 /64 counts as one), then 429 rate_limited."
      parameters:
        - { $ref: "#/components/parameters/OrganizerPath" }
        - { name: eventSlug, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrderLinksRequest" } } } }
      responses:
        "204": { description: "Queued, or nothing to send: the two look the same." }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /checkouts:
    post:
      operationId: createCheckout
      security: []
      x-idempotency-store: false
      description: "Anyone. Holds the tickets for 15 minutes and returns the checkout with its token, the buyer's only key to it: we keep just a hash, so it can't be shown again. Not enough left is 409 sold_out, with error.available listing what's left of every ticket type the buyer can see. A paid ticket needs an organizer whose Stripe account can take cards (409 payments_not_ready) and a server with a payment provider (503 payments_not_configured); free carts need neither. Nothing is held when either is refused. A code that takes nothing off and unlocks nothing in this cart is 422 promo_not_applicable. When the server has Turnstile on, send a turnstile_token: a missing or refused one is 422 turnstile_failed, and 503 turnstile_unavailable means Cloudflare couldn't check it just now. 10 checkouts a minute per client address (an IPv6 /64 counts as one), then 429 rate_limited. 503 try_again with Retry-After: 1 when the organizer is reshuffling capacity at that moment. Its response carries the checkout token, so we never keep it: a retry with the same key runs again and holds a fresh checkout (the first one's hold simply runs out), and a duplicate sent while the first is running gets 409 idempotency_in_progress."
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateCheckout" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Checkout" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /checkouts/{token}:
    get:
      operationId: getCheckout
      security: []
      description: "Whoever has the token. status is expired once the hold has run out with no payment started. Once a payment exists, a card may already be charged, so it stays paying past the hold until Stripe's answer settles it. cancelled: the hold is over and the payment was stopped, so nothing was charged (we stop a payment still unfinished an hour after its hold ran out). 409 event_cancelled once the organizer has cancelled the event. Answers come with Cache-Control: no-store. A completed checkout carries order_code and order_url, the buyer's link to their tickets, until the buyer asks for a new link (requestOrderLinks): from then on order_url is left out, and the link goes by email only. event carries what the checkout page needs: the event's names, the cart's ticket type names and the questions asked of them."
      parameters: [{ $ref: "#/components/parameters/CheckoutTokenPath" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Checkout" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /checkouts/{token}/pay:
    post:
      operationId: payCheckout
      security: []
      x-idempotency-store: false
      description: "Whoever has the token. Saves the buyer's email, names and answers, and starts paying: the first call gives the hold 5 more minutes. Calling it again (say, with a corrected email) updates the order and returns the same payment, never a second one. kind stripe or test: confirm the payment with client_secret (Stripe.js, with stripeAccount set to account). kind free: the order is already paid, and order_url is the buyer's link to it. 410 checkout_expired once the hold has run out; 409 checkout_completed when it's already paid (error.order_code says which order); 409 event_cancelled once the organizer has cancelled the event (a payment started as it was cancelled is stopped). 422 bad_email (field email); 422 bad_attendee when there are more names than tickets or one is over 120 characters (field attendees); 422 missing_answer for a required question left blank, and 422 bad_answer for an answer that isn't one of a select's options, a checkbox that isn't true or false, an answer over 1,000 characters, a question that isn't asked of that ticket, or a ticket_index out of range. Both name the answer as field answers.<question_id>.<ticket_index>, with -1 for questions asked once per order. A required checkbox has to be true. 422 below_minimum_charge when a paid order comes to less than $0.50. 409 payments_not_ready when the organizer's Stripe account can't take cards right now; 409 price_changed if the order's saved total no longer matches its tickets (start a new checkout); 503 payments_not_configured when the server has no payment provider; 503 payments_unavailable when Stripe can't be reached or had a problem of its own (the hold stays, so try again); 503 payments_refused when Stripe turned the payment down (the hold stays, but trying again won't help); 503 try_again with Retry-After: 1 when capacity is being reshuffled at that moment. 20 calls a minute per client address, then 429 rate_limited. Its response carries the payment's client secret, so we never keep it: a retry with the same key runs again and gets the same payment back, and a duplicate sent while the first is running gets 409 idempotency_in_progress."
      parameters: [{ $ref: "#/components/parameters/CheckoutTokenPath" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PayCheckout" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentStart" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /orders/{code}:
    get:
      operationId: getOrder
      security: []
      description: "The buyer's order page, for whoever holds the token from the order's link (the t= value in the email, and order_url). An unknown code, a wrong token and an order that isn't paid yet all get the same 404. The answer carries the tickets' QR values, so it comes with Cache-Control: no-store and Referrer-Policy: no-referrer. 60 reads a minute per client address, then 429 rate_limited. A cancelled order (the payment arrived after the tickets had gone) has no tickets; it shows refunded once the refund is on its way."
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, description: "The order code, like TS-7K2QF." }
        - { name: token, in: query, required: true, schema: { type: string }, description: "The t= value from the order's link." }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /orders/{code}/tickets.pdf:
    get:
      operationId: getOrderPDF
      security: []
      description: "The order's valid tickets as a PDF, one to a page, numbered as the email numbers them, for whoever holds the token from the order's link. An unknown code and a wrong token get the same 404. 409 no_tickets when the order has no valid ticket. It comes with Content-Disposition: attachment; filename=\"tickets-<code>.pdf\", Cache-Control: no-store and Referrer-Policy: no-referrer. Counts against the same 60 reads a minute per client address as getOrder, then 429 rate_limited."
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, description: "The order code, like TS-7K2QF." }
        - { name: token, in: query, required: true, schema: { type: string }, description: "The t= value from the order's link." }
      responses:
        "200":
          description: OK
          headers:
            Content-Disposition: { required: true, schema: { type: string } }
          content: { application/pdf: { schema: { type: string, format: binary } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /orders/{code}/email:
    post:
      operationId: requestTicketEmail
      security: []
      description: "The buyer asking for the ticket email again, with the token from the order's link: the same tickets and the same link, to the address on the order. It goes out from the queue, so this answers 202. An unknown code and a wrong token get the same 404. 409 email_on_its_way while the last one is still queued or being retried, 409 too_soon within 10 minutes of the last time it was asked for (by the buyer, the organizer or the sale itself), 409 no_tickets when the order has no valid ticket. Counts against the same 60 requests a minute per client address as getOrder, then 429 rate_limited."
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, description: "The order code, like TS-7K2QF." }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrderEmailRequest" } } } }
      responses:
        "202": { description: Queued }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    session: { type: http, scheme: bearer, description: "A session token, or an organizer API key (tsk_...). A key acts only within its own organizer, and gets 403 session_required on anything that needs a person: your account, your organizer list, the audit log and key management. A read key gets 403 scope_read_only on writes." }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, description: "1 to 255 printable ASCII characters. Retrying with the same key replays the first response instead of running again. Callers who aren't signed in need at least 22 characters from A-Z a-z 0-9 - _ (a UUID works).", schema: { type: string, minLength: 1, maxLength: 255 } }
    OrganizerPath: { name: organizer, in: path, required: true, schema: { type: string } }
    QuotaPath: { name: quota, in: path, required: true, schema: { type: string, format: uuid } }
    PromoCodePath: { name: promoCode, in: path, required: true, schema: { type: string, format: uuid } }
    QuestionPath: { name: question, in: path, required: true, schema: { type: string, format: uuid } }
    TicketTypePath: { name: ticketType, in: path, required: true, schema: { type: string, format: uuid } }
    EventPath: { name: event, in: path, required: true, schema: { type: string, format: uuid } }
    OrderPath: { name: order, in: path, required: true, schema: { type: string, format: uuid } }
    RefundPath: { name: refund, in: path, required: true, schema: { type: string, format: uuid } }
    CheckoutTokenPath: { name: token, in: path, required: true, schema: { type: string }, description: "The token createCheckout returned." }
  responses:
    Error: { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            field: { type: string, description: "The request property this error is about, when there is one (e.g. price_cents, applies_to, options[2])." }
            available: { type: array, items: { $ref: "#/components/schemas/Availability" }, description: "On 409 sold_out: what's left of every ticket type the buyer can see." }
            order_code: { type: string, description: "On 409 checkout_completed: the order this checkout became." }
    Availability:
      type: object
      required: [ticket_type_id, remaining]
      properties: { ticket_type_id: { type: string, format: uuid }, remaining: { type: integer, minimum: 0 } }
    StorefrontEvent:
      type: object
      required: [organizer, event, ticket_types, promo, questions]
      properties:
        organizer: { type: object, required: [name, slug], properties: { name: { type: string }, slug: { type: string } } }
        event:
          type: object
          required: [id, slug, name, description, venue_name, venue_address, timezone, starts_at, ends_at, fee_mode, state]
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            name: { type: string }
            description: { type: string }
            venue_name: { type: string }
            venue_address: { type: string }
            timezone: { type: string }
            starts_at: { type: string, format: date-time }
            ends_at: { type: string, format: date-time }
            fee_mode: { type: string, enum: [absorb, pass] }
            state: { type: string, enum: [on_sale, ended] }
        ticket_types: { type: array, items: { $ref: "#/components/schemas/StorefrontTicketType" }, description: In position order. }
        promo: { oneOf: [{ $ref: "#/components/schemas/StorefrontPromo" }, { type: "null" }], description: "The code's terms when it works right now; null otherwise." }
        questions: { type: array, items: { $ref: "#/components/schemas/StorefrontQuestion" }, description: In position order. }
    StorefrontPromo:
      type: object
      required: [code, kind, value]
      properties:
        code: { type: string }
        kind: { type: string, enum: [percent, amount] }
        value: { type: integer, format: int64, description: "percent: basis points. amount: cents off each ticket it covers. 0 is an access code: it unlocks, never discounts." }
    StorefrontTicketType:
      type: object
      required: [id, name, description, price_cents, min_per_order, max_per_order, remaining, on_sale, sales_start, sales_end, unlocked]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        price_cents: { type: integer, format: int64 }
        min_per_order: { type: integer }
        max_per_order: { type: integer }
        remaining: { type: integer, minimum: 0 }
        on_sale: { type: boolean, description: "Whether it can be bought right now: the event hasn't ended and its sales window is open." }
        sales_start: { type: [string, "null"], format: date-time }
        sales_end: { type: [string, "null"], format: date-time }
        unlocked: { type: boolean, description: A hidden ticket type that the request's code shows. }
    StorefrontQuestion:
      type: object
      required: [id, label, kind, options, required, scope, applies_to_all, applies_to]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        kind: { type: string, enum: [text, select, checkbox] }
        options: { type: array, items: { type: string } }
        required: { type: boolean }
        scope: { type: string, enum: [order, ticket] }
        applies_to_all: { type: boolean }
        applies_to: { type: array, items: { type: string, format: uuid }, description: "When applies_to_all is false: the ticket types it's asked of, among those shown." }
    CheckoutItem:
      type: object
      required: [ticket_type_id, quantity]
      properties:
        ticket_type_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 100 }
    CreateCheckout:
      type: object
      required: [organizer, event, items]
      properties:
        organizer: { type: string, description: "The organizer's slug, as in the storefront address." }
        event: { type: string, description: "The event's slug." }
        items: { type: array, items: { $ref: "#/components/schemas/CheckoutItem" }, description: "Each ticket type once. Up to 100 tickets in all (422 too_many_tickets), and each type's min_per_order to max_per_order (422 quantity_out_of_range)." }
        promo_code: { type: string, maxLength: 64, description: "Spaces around it and capitals don't matter." }
        turnstile_token: { $ref: "#/components/schemas/TurnstileToken" }
    OrderLinksRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, maxLength: 254, description: "The address the tickets were bought with." }
        turnstile_token: { $ref: "#/components/schemas/TurnstileToken" }
    QuoteTicket:
      type: object
      required: [ticket_type_id, price_cents, discount_cents, tax_cents, fee_cents, charge_cents, tax_included]
      properties:
        ticket_type_id: { type: string, format: uuid }
        price_cents: { type: integer, format: int64 }
        discount_cents: { type: integer, format: int64 }
        tax_cents: { type: integer, format: int64 }
        fee_cents: { type: integer, format: int64 }
        charge_cents: { type: integer, format: int64, description: "What the buyer pays for this ticket, before a passed-on fee." }
        tax_included: { type: boolean, description: "Whether tax_cents is already inside the price. When false it's added on top." }
    Quote:
      type: object
      required: [tickets, subtotal_cents, discount_cents, tax_cents, fee_cents, total_cents, fee_mode, included_tax_cents]
      properties:
        tickets: { type: array, items: { $ref: "#/components/schemas/QuoteTicket" } }
        subtotal_cents: { type: integer, format: int64 }
        discount_cents: { type: integer, format: int64 }
        tax_cents: { type: integer, format: int64 }
        fee_cents: { type: integer, format: int64, description: "Our service fee. The buyer pays it on top when fee_mode is pass; with absorb it comes out of the organizer's price." }
        total_cents: { type: integer, format: int64 }
        included_tax_cents: { type: integer, format: int64, description: "Tax already inside the prices, for an \"Includes $X tax\" note." }
        fee_mode: { type: string, enum: [absorb, pass] }
    Checkout:
      type: object
      required: [id, event_id, status, expires_at, items, promo_code, quote]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        token: { type: string, description: "Only when it's created. Keep it: it's the only key to this checkout." }
        status: { type: string, enum: [open, paying, completed, expired, cancelled] }
        expires_at: { type: string, format: date-time }
        items: { type: array, items: { $ref: "#/components/schemas/CheckoutItem" } }
        promo_code: { type: [string, "null"] }
        quote: { $ref: "#/components/schemas/Quote" }
        order_code: { type: string, description: Once completed. }
        order_url: { type: string, description: "Once completed: the buyer's link to their tickets. Left out once the buyer has asked for a new link, which goes by email only." }
        event: { $ref: "#/components/schemas/CheckoutEvent" }
    CheckoutEvent:
      type: object
      description: "getCheckout only: what the checkout page shows and asks."
      required: [organizer, slug, name, timezone, ticket_types, questions]
      properties:
        organizer: { type: string, description: "The organizer's slug, for the way back to the event." }
        slug: { type: string }
        name: { type: string }
        timezone: { type: string }
        ticket_types: { type: array, items: { $ref: "#/components/schemas/TicketName" }, description: "The cart's ticket types." }
        questions: { type: array, items: { $ref: "#/components/schemas/StorefrontQuestion" }, description: "In position order: the ones asked of the cart's ticket types." }
    TicketName:
      type: object
      required: [id, name]
      properties: { id: { type: string, format: uuid }, name: { type: string } }
    CheckoutAnswer:
      type: object
      required: [question_id, ticket_index, value]
      properties:
        question_id: { type: string, format: uuid }
        ticket_index: { type: integer, minimum: -1, maximum: 99, description: "-1 for a question asked once per order; otherwise which ticket, from 0, counting through the checkout's items in order." }
        value: { type: string, maxLength: 1000, description: "For a select, one of its options; for a checkbox, true or false." }
    PayCheckout:
      type: object
      required: [email]
      properties:
        email: { type: string, maxLength: 254, description: "Where the tickets go: one plain address, like ada@example.com (422 bad_email)." }
        attendees: { type: array, items: { type: string, maxLength: 120 }, description: "Optional names, one per ticket in the same order as ticket_index." }
        answers: { type: array, items: { $ref: "#/components/schemas/CheckoutAnswer" } }
    Order:
      type: object
      required: [code, status, email, event, totals, tickets, refunded_cents, returned_cents]
      properties:
        code: { type: string }
        status: { type: string, enum: [paid, cancelled, refunded, partially_refunded] }
        email: { type: string }
        refunded_cents: { type: integer, format: int64, description: "What has gone back, or is on its way back, to the buyer's card: every refund that hasn't failed." }
        returned_cents: { type: integer, format: int64, description: "Refunds that went through and that the buyer's bank then sent back to the organizer. Not counted in refunded_cents." }
        event:
          type: object
          required: [name, status, starts_at, ends_at, timezone, venue_name, venue_address, organizer_name]
          properties:
            name: { type: string }
            status: { type: string, enum: [live, ended, cancelled], description: "cancelled once the organizer has cancelled the event." }
            starts_at: { type: string, format: date-time }
            ends_at: { type: string, format: date-time }
            timezone: { type: string }
            venue_name: { type: string }
            venue_address: { type: string }
            organizer_name: { type: string }
        totals:
          type: object
          required: [subtotal_cents, discount_cents, tax_cents, fee_cents, total_cents]
          properties:
            subtotal_cents: { type: integer, format: int64 }
            discount_cents: { type: integer, format: int64 }
            tax_cents: { type: integer, format: int64 }
            fee_cents: { type: integer, format: int64 }
            total_cents: { type: integer, format: int64 }
        tickets: { type: array, items: { $ref: "#/components/schemas/OrderTicket" } }
    OrderTicket:
      type: object
      required: [id, ticket_type_name, attendee_name, status, refunded, qr, qr_png]
      properties:
        id: { type: string, format: uuid }
        ticket_type_name: { type: string }
        attendee_name: { type: string, description: "Empty when the buyer didn't give one." }
        status: { type: string, enum: [valid, void] }
        refunded: { type: boolean, description: "true when it's void because it was refunded." }
        qr: { type: [string, "null"], description: "What the ticket's QR code holds: 22 base64url characters. Whoever has it can get in, so show it only to the ticket's holder. null for a void ticket." }
        qr_png: { type: [string, "null"], description: "The same QR code drawn as a PNG, standard base64, ready for a data: URL. Whoever has it can get in. null for a void ticket." }
    OrderEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 200, description: "The t= value from the order's link." }
    PaymentStart:
      type: object
      required: [kind, amount_cents]
      properties:
        kind: { type: string, enum: [stripe, test, free], description: "test is the built-in fake provider, for development." }
        client_secret: { type: string, description: "For stripe and test: confirm the payment with it." }
        publishable_key: { type: string }
        account: { type: string, description: "The organizer's Stripe account, for Stripe.js's stripeAccount option. Left out when the server takes payments through its own Stripe account (direct mode): load Stripe.js without stripeAccount then." }
        amount_cents: { type: integer, format: int64 }
        order_code: { type: string, description: "For free: the order, already paid." }
        order_url: { type: string, description: "For free: the buyer's link to their tickets." }
    Health: { type: object, required: [status], properties: { status: { type: string } } }
    PaymentsStatus:
      type: object
      required: [provider, mode, connected, charges_enabled, details_submitted, disconnected, link_method, can_link_existing]
      properties:
        mode: { type: string, enum: [connect, direct], x-enum-varnames: [PaymentsModeConnect, PaymentsModeDirect], description: "connect: each organizer takes payments on its own connected Stripe account. direct: this server takes every payment through its own Stripe account (self-hosting), so there's nothing to connect, connected stays false, and paid tickets can go on sale without it." }
        provider: { type: string, enum: [stripe, test, none], description: "stripe in production, test for the built-in fake, none when the server takes no payments." }
        connected: { type: boolean, description: "Whether the organizer has a Stripe account it hasn't disconnected." }
        disconnected: { type: boolean, description: "Whether the organizer disconnected its Stripe account (or Stripe told us it was unlinked). Paid tickets are off sale until it connects again." }
        link_method: { oneOf: [{ $ref: "#/components/schemas/LinkMethod" }, { type: "null" }], description: "How the account arrived: created here, or an existing one linked. null without an account." }
        can_link_existing: { type: boolean, description: "Whether this server can link a Stripe account the organizer already has." }
        charges_enabled: { type: boolean, description: "Whether Stripe lets the account take payments. Paid tickets go on sale only when it does." }
        details_submitted: { type: boolean, description: Whether the organizer has finished Stripe's onboarding form. }
    OrderSummary:
      type: object
      required: [id, code, email, status, ticket_count, total_cents, fee_cents, fee_mode, created_at, paid_at, refunded_cents, fee_refunded_cents, ticket_email]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        email: { type: string }
        status: { type: string, enum: [paid, cancelled, refunded, partially_refunded] }
        ticket_count: { type: integer, description: "Tickets still valid." }
        total_cents: { type: integer, format: int64 }
        fee_cents: { type: integer, format: int64 }
        fee_mode: { type: string, enum: [absorb, pass] }
        created_at: { type: string, format: date-time }
        paid_at: { type: [string, "null"], format: date-time }
        refunded_cents: { type: integer, format: int64, description: "Refunded to the buyer so far, counting refunds still on their way and leaving out failed ones." }
        fee_refunded_cents: { type: integer, format: int64, description: "How much of our fee has gone back so far (counted once Stripe has returned it)." }
        ticket_email: { $ref: "#/components/schemas/OrderEmail" }
    OrderEmail:
      type: object
      description: How the order's ticket email is getting on.
      required: [status, problem, attempts, updated_at]
      properties:
        status: { type: [string, "null"], enum: [queued, sent, failing, gave_up, delivered, bounced, complained, null], description: "null: no ticket email yet. queued: waiting to go. sent: the mail service took it. failing: it hasn't gone yet and we're still trying. gave_up: we stopped trying. delivered: it reached the buyer's mail server. bounced: that server turned it away. complained: delivered, then the buyer marked it as spam." }
        problem: { type: [string, "null"], enum: [rate_limited, quota, refused, unreachable, bad_address, config, null], description: "The last thing that went wrong: rate_limited (the mail service asked us to slow down), quota (we hit our sending limit), refused (the mail service turned the message down), unreachable (we couldn't reach it), bad_address (the address can't take mail), config (our mail settings need fixing)." }
        attempts: { type: integer, description: "How many times we've tried to send this one." }
        updated_at: { type: [string, "null"], format: date-time }
    CreateCheckin:
      type: object
      description: Exactly one of qr and ticket_id.
      properties:
        qr: { type: string, minLength: 1, maxLength: 200, description: "The text the scanner read from the ticket's QR code." }
        ticket_id: { type: string, format: uuid, description: "A ticket picked by hand, from searchCheckinTickets." }
        gate: { type: string, maxLength: 40, description: "Which door, if you name them." }
    CheckinTicket:
      type: object
      required: [id, ticket_type_name, attendee_name, order_code, status, checked_in_at]
      properties:
        id: { type: string, format: uuid }
        ticket_type_name: { type: string }
        attendee_name: { type: string }
        order_code: { type: string }
        status: { type: string, enum: [valid, void] }
        checked_in_at: { type: [string, "null"], format: date-time, description: "When it was first checked in; null if it hasn't been." }
    CheckinResult:
      type: object
      required: [result, ticket, checked_in, sold]
      properties:
        result: { type: string, enum: [accepted, duplicate, invalid, void] }
        ticket: { oneOf: [{ $ref: "#/components/schemas/CheckinTicket" }, { type: "null" }], description: "The ticket the scan matched; null for invalid." }
        checked_in: { type: integer, description: "The event's valid tickets checked in so far." }
        sold: { type: integer, description: "The event's valid tickets." }
    CheckinSummary:
      type: object
      required: [checked_in, sold]
      properties:
        checked_in: { type: integer, description: "The event's valid tickets checked in so far." }
        sold: { type: integer, description: "The event's valid tickets." }
    EventReport:
      type: object
      required: [currency, gross_cents, refunded_cents, platform_fee_cents, tax_cents, net_cents, orders, sold, checked_in, ticket_types, quotas, sales_by_day, promo_codes]
      properties:
        currency: { type: string, enum: [USD] }
        gross_cents: { type: integer, format: int64, description: "Totals of the orders listOrders lists." }
        refunded_cents: { type: integer, format: int64, description: "Refunds that haven't failed: gone through or on their way." }
        platform_fee_cents: { type: integer, format: int64, description: "Our fee on succeeded payments, less the fee that has gone back." }
        tax_cents: { type: integer, format: int64, description: "Tax on the orders listOrders lists." }
        net_cents: { type: integer, format: int64, description: "gross_cents - refunded_cents - platform_fee_cents, before Stripe's processing fees." }
        orders: { type: integer, description: "The orders listOrders lists." }
        sold: { type: integer, description: "Valid tickets." }
        checked_in: { type: integer, description: "Valid tickets checked in." }
        ticket_types:
          type: array
          description: In position order.
          items: { $ref: "#/components/schemas/ReportTicketType" }
        quotas:
          type: array
          items: { $ref: "#/components/schemas/ReportQuota" }
        sales_by_day:
          type: array
          description: "By the day orders were paid (a late payment by the day it was placed), in the event's time zone, oldest first."
          items: { $ref: "#/components/schemas/ReportDay" }
        promo_codes:
          type: array
          items: { $ref: "#/components/schemas/ReportPromoCode" }
    ReportTicketType:
      type: object
      required: [id, name, sold, checked_in]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sold: { type: integer }
        checked_in: { type: integer }
    ReportQuota:
      type: object
      required: [id, name, size, remaining]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        size: { type: integer }
        remaining: { type: integer, description: "Size less tickets and live holds counted against it, never below 0." }
    ReportDay:
      type: object
      required: [day, orders, tickets, gross_cents]
      properties:
        day: { type: string, description: "YYYY-MM-DD." }
        orders: { type: integer }
        tickets: { type: integer }
        gross_cents: { type: integer, format: int64 }
    ReportPromoCode:
      type: object
      required: [code, used_count, max_uses, discount_cents]
      properties:
        code: { type: string }
        used_count: { type: integer }
        max_uses: { type: [integer, "null"] }
        discount_cents: { type: integer, format: int64, description: "Discount given on the orders listOrders lists." }
    OrderDetail:
      allOf:
        - { $ref: "#/components/schemas/OrderSummary" }
        - type: object
          required: [tickets, refunds]
          properties:
            tickets: { type: array, items: { $ref: "#/components/schemas/OrderDetailTicket" } }
            refunds: { type: array, items: { $ref: "#/components/schemas/Refund" }, description: "Newest first." }
    OrderDetailTicket:
      type: object
      required: [id, ticket_type_name, attendee_name, status, charge_cents, fee_cents, refund_id]
      properties:
        id: { type: string, format: uuid }
        ticket_type_name: { type: string }
        attendee_name: { type: string }
        status: { type: string, enum: [valid, void] }
        charge_cents: { type: integer, format: int64, description: "What the buyer paid for this ticket, before a passed-on fee." }
        fee_cents: { type: integer, format: int64 }
        refund_id: { type: [string, "null"], format: uuid, description: "The refund that covered this ticket; null when it hasn't been refunded, or cost nothing." }
    Refund:
      type: object
      required: [id, amount_cents, fee_cents, fee_back, status, reason, failure, returned_by_bank, created_at]
      properties:
        id: { type: string, format: uuid }
        amount_cents: { type: integer, format: int64, description: "What goes back to the buyer's card." }
        fee_cents: { type: integer, format: int64, description: "Our fee that goes back with it; 0 when it stays with us." }
        fee_back: { type: boolean }
        status: { type: string, enum: [requested, succeeded, failed] }
        reason: { type: string, enum: [late_payment, organizer, event_cancelled] }
        failure: { type: [string, "null"], enum: [stripe_failed, no_access, gave_up, null], description: "Why it failed. stripe_failed: Stripe turned it down. no_access: we can't reach your Stripe account any more, so refund from your own Stripe dashboard. gave_up: we couldn't get an answer from Stripe after ten tries." }
        returned_by_bank: { type: boolean, description: "true when it went through and the buyer's bank sent the money back (it's failed, with stripe_failed). The money is in your Stripe balance again." }
        created_at: { type: string, format: date-time }
    RefundOrderRequest:
      type: object
      required: [refund_fee]
      properties:
        ticket_ids: { type: array, minItems: 1, maxItems: 100, items: { type: string, format: uuid }, x-go-type: "nullable.Nullable[[]openapi_types.UUID]", x-go-type-skip-optional-pointer: true, description: "The tickets to refund, 1 to 100 of them. Leave it out to refund every ticket still valid; an empty list or null is refused (422 bad_tickets), so a slip can't refund the whole order." }
        refund_fee: { type: boolean, x-go-type: "*bool", description: "true gives our fee on these tickets back as well." }
    RefundResult:
      type: object
      required: [refund, ticket_ids, amount_cents, fee_cents, order_status]
      properties:
        refund: { oneOf: [{ $ref: "#/components/schemas/Refund" }, { type: "null" }], description: "null when the tickets cost nothing, so there was no money to send back." }
        ticket_ids: { type: array, items: { type: string, format: uuid } }
        amount_cents: { type: integer, format: int64 }
        fee_cents: { type: integer, format: int64 }
        order_status: { type: string, enum: [paid, cancelled, refunded, partially_refunded] }
    CancelEventRequest:
      type: object
      required: [confirm_name]
      properties:
        confirm_name: { type: string, maxLength: 200, description: "The event's name, typed out, to confirm." }
    CancelEventResult:
      type: object
      required: [event, orders, amount_cents, fee_cents]
      properties:
        event: { $ref: "#/components/schemas/Event" }
        orders: { type: integer, description: "Orders a refund was made for (a free order is voided with nothing to send back)." }
        amount_cents: { type: integer, format: int64, description: "Asked back from Stripe for buyers, in all." }
        fee_cents: { type: integer, format: int64, description: "Our fee going back, in all." }
    LinkMethod: { type: string, enum: [created, linked] }
    StripeLinkStart:
      type: object
      required: [url]
      properties:
        url: { type: string, description: "Stripe's page for picking the account to link. Its state works once, for ten minutes, so redirect to it straight away." }
    StripeLinkComplete:
      type: object
      required: [state, code]
      properties:
        state: { type: string, maxLength: 128, description: "The state Stripe sent back, unchanged." }
        code: { type: string, maxLength: 255, description: "The code Stripe sent back." }
    StripeLinked:
      type: object
      required: [organizer, status]
      properties:
        organizer: { type: string, description: "The slug of the organizer the account was linked to." }
        status: { $ref: "#/components/schemas/PaymentsStatus" }
    OnboardingLink:
      type: object
      required: [url]
      properties:
        url: { type: string, description: "Stripe's onboarding page. It works once and expires within minutes, so redirect to it straight away." }
    SignupRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 256 }
        name: { type: string, minLength: 1, maxLength: 120 }
        turnstile_token: { $ref: "#/components/schemas/TurnstileToken" }
    TurnstileToken: { type: string, maxLength: 2048, description: "The token from the Cloudflare Turnstile widget. Each one works once." }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        totp_code: { type: string, pattern: "^[0-9]{6}$" }
        recovery_code: { type: string, maxLength: 64, description: "One of the account's unused recovery codes, in place of an authenticator code or passkey. Spaces, hyphens and case don't matter; up to 64 characters are read, and 422 invalid_recovery_code means more than 32 are left once spaces and hyphens are dropped. Sending it together with totp_code is 422 one_second_step." }
        turnstile_token: { $ref: "#/components/schemas/TurnstileToken" }
    SessionCreated:
      type: object
      required: [session_token, user]
      properties: { session_token: { type: string }, user: { $ref: "#/components/schemas/Me" } }
    Me:
      type: object
      required: [id, email, name, email_verified, totp_enabled, has_passkey, has_second_factor, mfa]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        email_verified: { type: boolean }
        totp_enabled: { type: boolean }
        has_passkey: { type: boolean }
        has_second_factor: { type: boolean, description: Whether the account has a passkey or an authenticator app. }
        mfa: { type: boolean, description: Whether this session passed a second factor or a passkey. }
    TotpSetup:
      type: object
      required: [secret, otpauth_url]
      properties: { secret: { type: string }, otpauth_url: { type: string } }
    WebAuthnChallenge:
      type: object
      required: [challenge_id, options]
      properties: { challenge_id: { type: string, format: uuid }, options: { type: object, additionalProperties: true } }
    Passkey:
      type: object
      required: [id, name, created_at]
      properties: { id: { type: string, format: uuid }, name: { type: string }, created_at: { type: string, format: date-time } }
    CreateOrganizer:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, pattern: "^[a-z0-9](-?[a-z0-9])*$", minLength: 3, maxLength: 40, description: "The organizer's storefront address. checkout, orders, assets, api and healthz belong to the storefront itself (422 invalid_slug)." }
    Organizer:
      type: object
      required: [id, name, slug, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        role: { type: string, enum: [owner, admin, checkin, "key:read", "key:write"], description: "Your role here. An API key sees its own scope as key:read or key:write." }
    AuditEntry:
      type: object
      required: [id, action, entity_type, entity_id, actor_type, at]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid }
        actor_user_id: { type: string, format: uuid }
        actor_api_key_id: { type: string, format: uuid, description: Set instead of actor_user_id when an API key did it. }
        actor_type: { type: string, enum: [user, api_key, system], description: "Who did it: a person, an API key, or TicketSlinger itself (say, cancelling and refunding an order whose payment arrived after its tickets had gone)." }
        actor_name: { type: [string, "null"], description: "The person's name if they are still a member of this organizer, or the API key's name. Null for former members." }
        actor_email: { type: [string, "null"], description: "The person's email if they are still a member of this organizer. Null for API keys and former members." }
        at: { type: string, format: date-time }
    AddMember:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 254, x-go-type: string, description: "The email of their TicketSlinger account (422 invalid_email when it isn't one address)." }
        role: { type: string, enum: [admin, checkin], description: "admin runs events, refunds and reports; checkin scans tickets and finds guests." }
    Member:
      type: object
      required: [user_id, name, email, role]
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [owner, admin, checkin] }
    CreateApiKey:
      type: object
      required: [name, scope]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        scope: { type: string, enum: [read, write], description: "write can also read." }
    ApiKey:
      type: object
      required: [id, name, prefix, scope, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: "The first 8 characters after tsk_, so you can tell your keys apart." }
        scope: { type: string, enum: [read, write] }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, description: Accurate to about a minute. Absent if never used. }
        revoked_at: { type: string, format: date-time }
    ApiKeyCreated:
      type: object
      required: [api_key, token]
      properties:
        api_key: { $ref: "#/components/schemas/ApiKey" }
        token: { type: string, description: "The key itself. Copy it now: we only keep a hash, so it can't be shown again." }
    EventFields:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 20000 }
        venue_name: { type: string, maxLength: 160 }
        venue_address: { type: string, maxLength: 500 }
        timezone: { type: string, description: "An IANA time zone name, like Europe/London." }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time, description: Must be after starts_at. }
        fee_mode: { type: string, enum: [absorb, pass], description: "pass (the default) adds our fee to the buyer's total; absorb takes it out of your price." }
        tax_rate_bp: { type: integer, minimum: 0, maximum: 10000, description: "Tax in basis points: 825 is 8.25%." }
        prices_include_tax: { type: boolean }
    CreateEvent:
      allOf:
        - { $ref: "#/components/schemas/EventFields" }
        - type: object
          required: [slug, name, timezone, starts_at, ends_at]
          properties:
            slug: { type: string, pattern: "^[a-z0-9](-?[a-z0-9])*$", minLength: 3, maxLength: 60, description: Part of the event's web address. It can change while the event is a draft. }
    UpdateEvent:
      allOf:
        - { $ref: "#/components/schemas/EventFields" }
        - type: object
          properties:
            slug: { type: string, pattern: "^[a-z0-9](-?[a-z0-9])*$", minLength: 3, maxLength: 60, description: "Only while the event is a draft; otherwise 409 slug_locked." }
            status: { type: string, enum: [draft, live, ended, cancelled] }
    Event:
      type: object
      required: [id, slug, name, description, venue_name, venue_address, timezone, starts_at, ends_at, status, fee_mode, currency, tax_rate_bp, prices_include_tax, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        venue_name: { type: string }
        venue_address: { type: string }
        timezone: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        status: { type: string, enum: [draft, live, ended, cancelled] }
        fee_mode: { type: string, enum: [absorb, pass] }
        currency: { type: string, enum: [USD] }
        tax_rate_bp: { type: integer }
        prices_include_tax: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    QuotaFields:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        size: { type: integer, minimum: 0, maximum: 1000000, description: How many tickets this capacity holds across all its ticket types. }
        ticket_type_ids: { type: array, items: { type: string, format: uuid }, description: "The ticket types that draw on this capacity. On a patch the list replaces the current one; leave it out to keep it." }
    CreateQuota:
      allOf:
        - { $ref: "#/components/schemas/QuotaFields" }
        - { type: object, required: [name, size], properties: { size: { type: integer, minimum: 0, maximum: 1000000, x-go-type: "*int" } } }
    Quota:
      type: object
      required: [id, event_id, name, size, ticket_type_ids, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        name: { type: string }
        size: { type: integer }
        ticket_type_ids: { type: array, items: { type: string, format: uuid } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PromoCodeFields:
      type: object
      properties:
        code: { type: string, minLength: 3, maxLength: 32, description: "3 to 32 letters, numbers and hyphens. Stored upper-case; unique within the event." }
        kind: { type: string, enum: [percent, amount] }
        value: { type: integer, format: int64, minimum: 0, maximum: 10000000, description: "percent: basis points, 0 to 10000 (1000 is 10%). amount: cents, 0 to 10000000 ($100,000). 0 makes an access code: no discount, so unlocks must not be empty (422 bad_discount), on create and on any patch that sends value or unlocks." }
        max_uses: { type: [integer, "null"], minimum: 1, description: "null means unlimited." }
        valid_from: { type: [string, "null"], format: date-time }
        valid_until: { type: [string, "null"], format: date-time, description: Must be after valid_from. }
        applies_to_all: { type: boolean, description: "true (the default) discounts every ticket type; then applies_to must be empty (422 applies_to_conflict). false limits it to applies_to, which must not be empty (422 applies_to_required). If every listed ticket type is later deleted, the code applies to nothing, never to everything." }
        applies_to: { type: array, items: { type: string, format: uuid }, description: "Ticket types the discount covers when applies_to_all is false. On a patch the list replaces the current one." }
        unlocks: { type: array, items: { type: string, format: uuid }, description: "Hidden ticket types this code reveals. On a patch the list replaces the current one." }
    CreatePromoCode:
      allOf:
        - { $ref: "#/components/schemas/PromoCodeFields" }
        - { type: object, required: [code, kind, value], properties: { code: { type: string, x-go-type: "*string" }, kind: { type: string, enum: [percent, amount], x-go-type: "*string" }, value: { type: integer, format: int64, x-go-type: "*int64" } } }
    PromoCode:
      type: object
      required: [id, event_id, code, kind, value, max_uses, used_count, valid_from, valid_until, applies_to_all, applies_to, unlocks, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        code: { type: string }
        kind: { type: string, enum: [percent, amount] }
        value: { type: integer, format: int64 }
        max_uses: { type: [integer, "null"] }
        used_count: { type: integer, description: Read-only. Checkout counts it. }
        valid_from: { type: [string, "null"], format: date-time }
        valid_until: { type: [string, "null"], format: date-time }
        applies_to_all: { type: boolean }
        applies_to: { type: array, items: { type: string, format: uuid } }
        unlocks: { type: array, items: { type: string, format: uuid } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    QuestionFields:
      type: object
      properties:
        label: { type: string, minLength: 1, maxLength: 200 }
        kind: { type: string, enum: [text, select, checkbox] }
        options: { type: array, items: { type: string, minLength: 1, maxLength: 120 }, description: "A select needs 2 to 30, different ignoring capitals (422 bad_options). Text and checkbox questions have none. On a patch the list replaces the current one." }
        required: { type: boolean, description: Defaults to false. }
        scope: { type: string, enum: [order, ticket], description: "order: asked once per order. ticket: asked for every ticket." }
        applies_to_all: { type: boolean, description: "true (the default) asks it for every ticket type; then applies_to must be empty (422 applies_to_conflict). false limits it to applies_to, which must not be empty (422 applies_to_required). If every listed ticket type is later deleted, the question is never asked." }
        applies_to: { type: array, items: { type: string, format: uuid }, description: "Ticket types the question covers when applies_to_all is false. On a patch the list replaces the current one." }
    CreateQuestion:
      allOf:
        - { $ref: "#/components/schemas/QuestionFields" }
        - { type: object, required: [label, kind, scope], properties: { label: { type: string, x-go-type: "*string" }, kind: { type: string, enum: [text, select, checkbox], x-go-type: "*string" }, scope: { type: string, enum: [order, ticket], x-go-type: "*string" } } }
    Question:
      type: object
      required: [id, event_id, label, kind, options, required, scope, applies_to_all, applies_to, position, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        label: { type: string }
        kind: { type: string, enum: [text, select, checkbox] }
        options: { type: array, items: { type: string } }
        required: { type: boolean }
        scope: { type: string, enum: [order, ticket] }
        applies_to_all: { type: boolean }
        applies_to: { type: array, items: { type: string, format: uuid } }
        position: { type: integer, minimum: 1, description: "1 is first. Change it with the order endpoint." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TicketTypeFields:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        price_cents: { type: integer, format: int64, minimum: 0, maximum: 10000000, description: "In cents: 2500 is $25. 0 makes it free; otherwise it costs at least 50, the least a card can be charged (422 below_minimum_charge). Up to $100,000." }
        tax_rate_bp: { type: [integer, "null"], minimum: 0, maximum: 10000, description: "Overrides the event's tax rate. Send null to go back to the event's. Leave it out to keep it as it is." }
        prices_include_tax: { type: [boolean, "null"], description: "Overrides the event's setting. Send null to go back to the event's. Leave it out to keep it as it is." }
        sales_start: { type: [string, "null"], format: date-time }
        sales_end: { type: [string, "null"], format: date-time, description: Must be after sales_start. }
        min_per_order: { type: integer, minimum: 1, maximum: 100, description: "Defaults to 1." }
        max_per_order: { type: integer, minimum: 1, maximum: 100, description: "Defaults to 10. Never below min_per_order." }
        hidden: { type: boolean }
    CreateTicketType:
      allOf:
        - { $ref: "#/components/schemas/TicketTypeFields" }
        - { type: object, required: [name, price_cents], properties: { price_cents: { type: integer, format: int64, minimum: 0, maximum: 10000000, x-go-type: "*int64" }, quota_ids: { type: array, items: { type: string, format: uuid }, description: "Quotas of this event to join. Optional on a draft; a live event needs at least one (409 live_needs_capacity). An id from another event is 422 unknown_quota." } } }
    OrderIds:
      type: object
      required: [ids]
      properties:
        ids: { type: array, items: { type: string, format: uuid } }
    TicketType:
      type: object
      required: [id, event_id, name, description, price_cents, tax_rate_bp, prices_include_tax, sales_start, sales_end, min_per_order, max_per_order, hidden, position, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        price_cents: { type: integer, format: int64 }
        tax_rate_bp: { type: [integer, "null"], description: "null means the event's rate." }
        prices_include_tax: { type: [boolean, "null"], description: "null means the event's setting." }
        sales_start: { type: [string, "null"], format: date-time }
        sales_end: { type: [string, "null"], format: date-time }
        min_per_order: { type: integer }
        max_per_order: { type: integer }
        hidden: { type: boolean }
        position: { type: integer, minimum: 1, description: "1 is first. Change it with the order endpoint." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
